apiVersion: v1
kind: Service
metadata:
  name: principia-atlas-hosted
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: principia-atlas-hosted
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: principia-atlas-hosted
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: principia-atlas-hosted
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: principia-atlas-hosted
spec:
  serviceName: principia-atlas-hosted
  replicas: 2
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: principia-atlas-hosted
  template:
    metadata:
      labels:
        app.kubernetes.io/name: principia-atlas-hosted
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hosted
          image: ghcr.io/rhodan-lab/principia-atlas-hosted@sha256:REPLACE_WITH_VERIFIED_IMAGE_DIGEST
          imagePullPolicy: IfNotPresent
          args:
            - --catalog
            - /config/catalog.json
            - --tenants
            - /config/tenants.json
            - --store
            - /store
            - --state
            - /state/auth-state.sqlite
            - --identity-secret-file
            - /run/secrets/identity
            - --session-secret-file
            - /run/secrets/session
            - --metrics-token-file
            - /run/secrets/metrics
            - --audit-log
            - /audit/$(POD_NAME).ndjson
            - --instance-id
            - $(POD_NAME)
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --allow-network
            - --shutdown-timeout-ms
            - "20000"
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 3"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: release-store
              mountPath: /store
              readOnly: true
            - name: auth-state
              mountPath: /state
            - name: audit
              mountPath: /audit
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: principia-atlas-hosted-config
        - name: release-store
          persistentVolumeClaim:
            claimName: principia-atlas-release-store
        - name: auth-state
          persistentVolumeClaim:
            claimName: principia-atlas-auth-state
        - name: audit
          persistentVolumeClaim:
            claimName: principia-atlas-audit
        - name: secrets
          secret:
            secretName: principia-atlas-hosted-secrets
            defaultMode: 0440
        - name: temporary
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: principia-atlas-hosted
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: principia-atlas-hosted
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
  egress: []
