apiVersion: v1
kind: Service
metadata:
  name: principia-atlas-hosted-headless
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: principia-atlas-hosted
  ports:
    - name: edge-http
      port: 8081
      targetPort: edge-http
---
apiVersion: v1
kind: Service
metadata:
  name: principia-atlas-browser-edge
spec:
  selector:
    app.kubernetes.io/name: principia-atlas-hosted
  ports:
    - name: edge-http
      port: 8081
      targetPort: edge-http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: principia-atlas-hosted
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: principia-atlas-hosted
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: principia-atlas-hosted
spec:
  serviceName: principia-atlas-hosted-headless
  replicas: 2
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: principia-atlas-hosted
  template:
    metadata:
      labels:
        app.kubernetes.io/name: principia-atlas-hosted
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hosted
          image: ghcr.io/rhodan-lab/principia-atlas-hosted@sha256:REPLACE_WITH_VERIFIED_IMAGE_DIGEST
          imagePullPolicy: IfNotPresent
          args:
            - --catalog
            - /config/catalog.json
            - --tenants
            - /config/tenants.json
            - --store
            - /store
            - --state
            - /state/auth-state.sqlite
            - --identity-secret-file
            - /run/secrets/identity
            - --session-secret-file
            - /run/secrets/session
            - --metrics-token-file
            - /run/secrets/metrics
            - --oidc-policy
            - /config/oidc-policy.json
            - --oidc-remote-jwks
            - --audit-log
            - /audit/$(POD_NAME).ndjson
            - --instance-id
            - $(POD_NAME)
            - --host
            - 127.0.0.1
            - --port
            - "8080"
            - --shutdown-timeout-ms
            - "20000"
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - fetch('http://127.0.0.1:8080/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 3"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: release-store
              mountPath: /store
              readOnly: true
            - name: auth-state
              mountPath: /state
            - name: audit
              mountPath: /audit
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
            - name: temporary
              mountPath: /tmp
        - name: browser-edge
          image: ghcr.io/rhodan-lab/principia-atlas-hosted@sha256:REPLACE_WITH_VERIFIED_IMAGE_DIGEST
          imagePullPolicy: IfNotPresent
          command:
            - node
            - /opt/principia-atlas/hosted/browser_edge_cli.mjs
          args:
            - serve
            - --config
            - /config/browser-oidc.json
            - --flow-secret-file
            - /run/secrets/browser-flow
            - --client-secret-file
            - /run/secrets/browser-client
            - --upstream-origin
            - http://127.0.0.1:8080
            - --host
            - 0.0.0.0
            - --port
            - "8081"
            - --allow-network
            - --shutdown-timeout-ms
            - "20000"
          ports:
            - name: edge-http
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /edge/healthz
              port: edge-http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /edge/healthz
              port: edge-http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 3"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: principia-atlas-hosted-config
        - name: release-store
          persistentVolumeClaim:
            claimName: principia-atlas-release-store
        - name: auth-state
          persistentVolumeClaim:
            claimName: principia-atlas-auth-state
        - name: audit
          persistentVolumeClaim:
            claimName: principia-atlas-audit
        - name: secrets
          secret:
            secretName: principia-atlas-hosted-secrets
            defaultMode: 0440
        - name: temporary
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: principia-atlas-hosted
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: principia-atlas-hosted
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - ports:
        - protocol: TCP
          port: 8081
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            # Fail-closed documentation range. Replace with reviewed identity-provider CIDRs.
            cidr: 203.0.113.0/24
      ports:
        - protocol: TCP
          port: 443
