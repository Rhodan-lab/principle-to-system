name: Validate Phase 46 population-readiness assurance

on:
  pull_request:
    paths-ignore:
      - 'software/product_alpha/**'
      - 'software/tests/test_product_alpha*.py'
  push:
    paths-ignore:
      - 'software/product_alpha/**'
      - 'software/tests/test_product_alpha*.py'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Phase 46 validation chain
        run: |
          python3 -m py_compile \
            scripts/generate_phase46_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_decision_candidate_population_readiness_assurance.py \
            scripts/validate_phase46_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_decision_candidate_population_readiness_assurance.py \
            scripts/validate_phase46_postmerge_record.py \
            scripts/validate_phase45_postmerge_record.py \
            scripts/validate_phase44_postmerge_record.py \
            scripts/validate_phase43_postmerge_record.py \
            scripts/validate_phase42_postmerge_record.py
      - name: Check frozen Phase 46 candidate manifest
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          path = Path("release/phase-46-offline-consequence-plan-review-response-intake-envelope-validation-execution-authorization-decision-candidate-population-readiness-assurance.json")
          expected = "2b7ced60688ff02ea11231bc53bad3e39e0ec22aa10a233e5f270b0d586039ad"
          actual = hashlib.sha256(path.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f"Phase 46 candidate manifest digest drift: {actual}")
          print(f"Phase 46 frozen candidate manifest passed: sha256={actual}")
          PY
      - name: Run independent Phase 46 validator
        run: python3 scripts/validate_phase46_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_decision_candidate_population_readiness_assurance.py
      - name: Validate Phase 46 post-merge record
        run: python3 scripts/validate_phase46_postmerge_record.py
      - name: Run Phase 46 mutation tests
        run: python3 -m unittest discover -s software/tests -p 'test_phase46*population_readiness_assurance.py' -v
      - name: Revalidate Phase 45 finalization
        run: python3 scripts/validate_phase45_postmerge_record.py
      - name: Revalidate Phase 44 finalization
        run: python3 scripts/validate_phase44_postmerge_record.py
      - name: Revalidate Phase 43 finalization
        run: python3 scripts/validate_phase43_postmerge_record.py
      - name: Revalidate Phase 42 finalization
        run: python3 scripts/validate_phase42_postmerge_record.py
      - name: Verify permanent workflow immutability
        run: |
          git diff --exit-code -- . ':(exclude)**/__pycache__/**' ':(exclude)**/*.pyc'
          git diff --cached --exit-code -- . ':(exclude)**/__pycache__/**' ':(exclude)**/*.pyc'
          test -z "$(git status --porcelain --untracked-files=all | grep -Ev '(__pycache__/|\.pyc$)' || true)"
