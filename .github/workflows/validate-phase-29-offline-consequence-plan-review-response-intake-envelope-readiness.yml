name: Validate Phase 29 Offline Consequence Plan Review Response Intake Envelope Readiness

on:
  push:
    branches:
      - agent/phase-29-offline-consequence-plan-review-response-intake-envelope-readiness
      - agent/finalize-phase-29-record
    paths:
      - 'release/phase-28-postmerge.json'
      - 'release/phase-28-offline-consequence-plan-review-response-intake-readiness-assurance.json'
      - 'release/phase-29-offline-consequence-plan-review-response-intake-envelope-readiness.json'
      - 'release/phase-29-postmerge.json'
      - 'reports/phase-29-offline-consequence-plan-review-response-intake-envelope-readiness.md'
      - 'scripts/generate_phase29_offline_consequence_plan_review_response_intake_envelope_readiness.py'
      - 'scripts/validate_phase29_offline_consequence_plan_review_response_intake_envelope_readiness.py'
      - 'scripts/validate_phase29_postmerge_record.py'
      - 'software/tests/test_phase29_offline_consequence_plan_review_response_intake_envelope_readiness.py'
      - 'PROJECT_STATE.md'
      - '.github/workflows/validate-phase-29-offline-consequence-plan-review-response-intake-envelope-readiness.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'software/product_alpha/**'
      - 'software/tests/test_product_alpha*.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-phase-29-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Principia Phase 29 evidence
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Phase 29 and inherited validators
        run: |
          python3 -m py_compile scripts/generate_phase29_offline_consequence_plan_review_response_intake_envelope_readiness.py
          python3 -m py_compile scripts/validate_phase29_offline_consequence_plan_review_response_intake_envelope_readiness.py
          python3 -m py_compile software/tests/test_phase29_offline_consequence_plan_review_response_intake_envelope_readiness.py
          if [ -f scripts/validate_phase29_postmerge_record.py ]; then python3 -m py_compile scripts/validate_phase29_postmerge_record.py; fi
          python3 -m py_compile scripts/generate_phase28_offline_consequence_plan_review_response_intake_readiness_assurance.py
          python3 -m py_compile scripts/validate_phase28_offline_consequence_plan_review_response_intake_readiness_assurance.py
          python3 -m py_compile scripts/validate_phase28_postmerge_record.py
      - name: Run complete Phase 29 chain
        id: phase29_chain
        shell: bash
        run: |
          set +e
          status=0
          run_check() { printf '\n$'; printf ' %q' "$@"; printf '\n'; "$@" || status=1; }
          {
            run_check python3 scripts/generate_phase29_offline_consequence_plan_review_response_intake_envelope_readiness.py --check
            run_check python3 scripts/validate_phase29_offline_consequence_plan_review_response_intake_envelope_readiness.py
            if [ -f scripts/validate_phase29_postmerge_record.py ]; then run_check python3 scripts/validate_phase29_postmerge_record.py; fi
            run_check python3 -m unittest software.tests.test_phase29_offline_consequence_plan_review_response_intake_envelope_readiness -v
            run_check python3 scripts/generate_phase28_offline_consequence_plan_review_response_intake_readiness_assurance.py --check
            run_check python3 scripts/validate_phase28_offline_consequence_plan_review_response_intake_readiness_assurance.py
            run_check python3 scripts/validate_phase28_postmerge_record.py
            run_check python3 -m unittest software.tests.test_phase28_offline_consequence_plan_review_response_intake_readiness_assurance -v
            run_check python3 scripts/generate_phase27_offline_consequence_plan_review_response_intake_readiness.py --check
            run_check python3 scripts/validate_phase27_offline_consequence_plan_review_response_intake_readiness.py
            run_check python3 scripts/validate_phase27_postmerge_record.py
            run_check python3 -m unittest software.tests.test_phase27_offline_consequence_plan_review_response_intake_readiness -v
            run_check python3 scripts/validate_principia_atlas_bridge.py
            run_check python3 scripts/validate_principia_atlas_audit.py
            run_check python3 scripts/validate_experiences.py --strict
            run_check python3 scripts/validate_repo.py --strict
            run_check python3 scripts/validate_phase12_release_candidate.py
            run_check python3 -m unittest discover -s software/tests -v
            run_check python3 scripts/validate_phase13_software.py
          } > phase29-validation.log 2>&1
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat phase29-validation.log
          exit 0
      - name: Upload complete Phase 29 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase29-response-intake-envelope-readiness-diagnostics
          path: phase29-validation.log
      - name: Stop on Phase 29 errors
        if: steps.phase29_chain.outputs.status != '0'
        run: exit 1
      - name: Verify permanent workflow immutability
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow=Path('.github/workflows/validate-phase-29-offline-consequence-plan-review-response-intake-envelope-readiness.yml').read_text()
          forbidden=('contents'+': write','git '+'push','git '+'commit','pull_request'+'_target','repository: Rhodan-lab/'+'Atlas','cu'+'rl ','wg'+'et ')
          assert 'contents: read' in workflow
          for token in forbidden: assert token not in workflow, token
          PY
