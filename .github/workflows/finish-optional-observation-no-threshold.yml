name: Finish Optional Observation No Threshold

on:
  pull_request:
    paths:
      - "PRODUCT_STATE.md"
      - "software/product_alpha/**"
      - "software/tests/test_product_alpha*.py"
      - "software/tests/test_product_alpha*.mjs"
      - ".github/workflows/finish-optional-observation-no-threshold.yml"

permissions:
  contents: read

jobs:
  finish:
    if: github.head_ref == 'agent/remove-optional-observation-threshold'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-optional-observation-threshold
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply complete bounded migration
        run: |
          if ! grep -q 'optional-descriptive' software/product_alpha/evaluation/summarize.py; then
            python3 - <<'PY'
          from pathlib import Path
          path = Path("software/product_alpha/pilot-lab.html")
          text = path.read_text(encoding="utf-8")
          old = 'Evidence gate incomplete: 0 of 5 valid sessions.'
          new = 'Optional observation set is empty. Add valid records only when external observation is useful.'
          if text.count(old) != 1:
              raise SystemExit(f"static Pilot Lab status: expected one anchor, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
            python3 software/product_alpha/_remove_optional_observation_threshold.py
          fi
          if ! grep -q '"observation_mode",' software/product_alpha/evaluation/prepare_handoff.py; then
            python3 software/product_alpha/_finish_optional_observation_threshold_migration.py
          fi
      - name: Validate complete migration
        env:
          PYTHONWARNINGS: error::SyntaxWarning
        run: |
          python3 -m py_compile \
            software/product_alpha/evaluation/summarize.py \
            software/product_alpha/evaluation/assemble_workspace.py \
            software/product_alpha/evaluation/workspace_status.py \
            software/product_alpha/evaluation/prepare_workspace.py \
            software/product_alpha/evaluation/prepare_handoff.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('software/product_alpha/pilot-lab.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          if len(scripts) != 1:
              raise SystemExit('pilot-lab.html must contain exactly one inline script')
          Path('/tmp/principia-pilot-lab.js').write_text(scripts[0], encoding='utf-8')
          PY
          node --check /tmp/principia-pilot-lab.js
          node --test software/tests/test_product_alpha*.mjs
          python3 -m unittest discover -s software/tests -p 'test_product_alpha*.py' -v
          python3 software/product_alpha/build.py check --route refrigerator
          python3 software/product_alpha/build.py check --route distributed-information
          python3 software/product_alpha/run_pilot.py check --route refrigerator
          python3 software/product_alpha/run_pilot.py check --route distributed-information
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "PRODUCT_STATE.md software/product_alpha/PILOT.md software/product_alpha/evaluation/assemble_workspace.py software/product_alpha/evaluation/prepare_handoff.py software/product_alpha/evaluation/prepare_workspace.py software/product_alpha/evaluation/summarize.py software/product_alpha/evaluation/workspace_status.py software/product_alpha/pilot-lab.html software/tests/test_product_alpha.py software/tests/test_product_alpha_cohort_binding.py software/tests/test_product_alpha_evaluation.py software/tests/test_product_alpha_human_decision.py software/tests/test_product_alpha_review_packet.py software/tests/test_product_alpha_verify_cohort.py software/tests/test_product_alpha_workspace_intake.py software/tests/test_product_alpha_workspace_status.py "
      - name: Commit complete migration
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            PRODUCT_STATE.md \
            software/product_alpha/PILOT.md \
            software/product_alpha/pilot-lab.html \
            software/product_alpha/evaluation/summarize.py \
            software/product_alpha/evaluation/assemble_workspace.py \
            software/product_alpha/evaluation/workspace_status.py \
            software/product_alpha/evaluation/prepare_workspace.py \
            software/product_alpha/evaluation/prepare_handoff.py \
            software/tests/test_product_alpha.py \
            software/tests/test_product_alpha_cohort_binding.py \
            software/tests/test_product_alpha_evaluation.py \
            software/tests/test_product_alpha_workspace_intake.py \
            software/tests/test_product_alpha_workspace_status.py \
            software/tests/test_product_alpha_review_packet.py \
            software/tests/test_product_alpha_verify_cohort.py \
            software/tests/test_product_alpha_human_decision.py
          git commit -m "Remove participant-count gate from optional observation"
          git push origin HEAD:agent/remove-optional-observation-threshold
