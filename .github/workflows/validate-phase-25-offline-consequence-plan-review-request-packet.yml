name: Validate Phase 25 Offline Consequence Plan Review Request Packet

on:
  push:
    branches:
      - agent/phase-25-offline-consequence-plan-review-request-packet
      - agent/finalize-phase-25-record
    paths:
      - 'integration/principia-atlas/**'
      - 'release/phase-24-postmerge.json'
      - 'release/phase-25-offline-consequence-plan-review-request-packet.json'
      - 'release/phase-25-postmerge.json'
      - 'reports/phase-25-offline-consequence-plan-review-request-packet.md'
      - 'scripts/generate_phase25_offline_consequence_plan_review_request_packet.py'
      - 'scripts/validate_phase25_offline_consequence_plan_review_request_packet.py'
      - 'scripts/validate_phase25_postmerge_record.py'
      - 'software/tests/test_phase25_offline_consequence_plan_review_request_packet.py'
      - 'PROJECT_STATE.md'
      - '.github/workflows/validate-phase-25-offline-consequence-plan-review-request-packet.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-phase-25-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Principia Phase 25 evidence
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Phase 25 and inherited validators
        run: |
          python3 -m py_compile scripts/generate_phase25_offline_consequence_plan_review_request_packet.py
          python3 -m py_compile scripts/validate_phase25_offline_consequence_plan_review_request_packet.py
          python3 -m py_compile software/tests/test_phase25_offline_consequence_plan_review_request_packet.py
          python3 -m py_compile scripts/generate_phase24_offline_consequence_plan_review_readiness.py
          python3 -m py_compile scripts/validate_phase24_offline_consequence_plan_review_readiness.py
          python3 -m py_compile scripts/validate_phase24_postmerge_record.py
          python3 -m py_compile scripts/generate_phase23_offline_consequence_plan_assurance.py
          python3 -m py_compile scripts/validate_phase23_offline_consequence_plan_assurance.py
          python3 -m py_compile scripts/validate_phase23_postmerge_record.py
          python3 -m py_compile scripts/validate_phase22_postmerge_record.py
          python3 -m py_compile scripts/validate_phase21_postmerge_record.py
          python3 -m py_compile scripts/validate_phase20_postmerge_record.py
          python3 -m py_compile scripts/validate_phase19_postmerge_record.py
          python3 -m py_compile scripts/validate_phase18_postmerge_record.py
          python3 -m py_compile scripts/validate_phase17_postmerge_record.py
          python3 -m py_compile scripts/validate_phase16_postmerge_record.py
          python3 -m py_compile scripts/validate_phase15_postmerge_record.py

      - name: Run complete Phase 25 chain
        id: phase25_chain
        shell: bash
        run: |
          set +e
          status=0
          run_check() {
            printf '\n$'
            printf ' %q' "$@"
            printf '\n'
            "$@" || status=1
          }
          {
            run_check python3 scripts/generate_phase25_offline_consequence_plan_review_request_packet.py --check
            run_check python3 scripts/validate_phase25_offline_consequence_plan_review_request_packet.py
            run_check python3 -m unittest software.tests.test_phase25_offline_consequence_plan_review_request_packet -v
            run_check python3 scripts/generate_phase24_offline_consequence_plan_review_readiness.py --check
            run_check python3 scripts/validate_phase24_offline_consequence_plan_review_readiness.py
            run_check python3 scripts/validate_phase24_postmerge_record.py
            run_check python3 -m unittest software.tests.test_phase24_offline_consequence_plan_review_readiness -v
            run_check python3 scripts/generate_phase23_offline_consequence_plan_assurance.py --check
            run_check python3 scripts/validate_phase23_offline_consequence_plan_assurance.py
            run_check python3 scripts/validate_phase23_postmerge_record.py
            run_check python3 -m unittest software.tests.test_phase23_offline_consequence_plan_assurance -v
            run_check python3 scripts/validate_phase22_postmerge_record.py
            run_check python3 scripts/generate_phase22_offline_resolution_consequence_planning.py --check
            run_check python3 scripts/validate_phase22_offline_resolution_consequence_planning.py
            run_check python3 -m unittest software.tests.test_phase22_offline_resolution_consequence_planning -v
            run_check python3 scripts/validate_phase21_postmerge_record.py
            run_check python3 scripts/generate_phase21_offline_policy_resolution_reconciliation.py --check
            run_check python3 scripts/validate_phase21_offline_policy_resolution_reconciliation.py
            run_check python3 -m unittest software.tests.test_phase21_offline_policy_resolution_reconciliation -v
            run_check python3 scripts/validate_phase20_postmerge_record.py
            run_check python3 scripts/generate_phase20_offline_manual_policy_resolution.py --check
            run_check python3 scripts/validate_phase20_offline_manual_policy_resolution.py
            run_check python3 -m unittest software.tests.test_phase20_offline_manual_policy_resolution -v
            run_check python3 scripts/validate_phase19_postmerge_record.py
            run_check python3 scripts/generate_phase19_offline_reconciliation_policy.py --check
            run_check python3 scripts/validate_phase19_offline_reconciliation_policy.py
            run_check python3 -m unittest software.tests.test_phase19_offline_reconciliation_policy -v
            run_check python3 scripts/validate_phase18_postmerge_record.py
            run_check python3 scripts/generate_phase18_offline_reconciliation.py --check
            run_check python3 scripts/generate_phase18_release_record.py --check
            run_check python3 scripts/validate_phase18_offline_reconciliation.py
            run_check python3 -m unittest software.tests.test_phase18_offline_reconciliation -v
            run_check python3 scripts/validate_phase17_postmerge_record.py
            run_check python3 scripts/validate_phase16_postmerge_record.py
            run_check python3 scripts/validate_phase15_postmerge_record.py
            run_check python3 scripts/validate_principia_atlas_bridge.py
            run_check python3 scripts/validate_principia_atlas_audit.py
            run_check python3 scripts/validate_experiences.py --strict
            run_check python3 scripts/validate_repo.py --strict
            run_check python3 scripts/validate_phase12_release_candidate.py
            run_check python3 -m unittest discover -s software/tests -v
            run_check python3 scripts/validate_phase13_software.py
          } > phase25-offline-consequence-plan-review-request-packet-validation.log 2>&1
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat phase25-offline-consequence-plan-review-request-packet-validation.log
          exit 0

      - name: Upload complete Phase 25 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase25-offline-consequence-plan-review-request-packet-validation-diagnostics
          path: phase25-offline-consequence-plan-review-request-packet-validation.log

      - name: Stop on Phase 25 errors
        if: steps.phase25_chain.outputs.status != '0'
        run: exit 1

      - name: Verify permanent workflow immutability
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/validate-phase-25-offline-consequence-plan-review-request-packet.yml').read_text(encoding='utf-8')
          forbidden = (
              'contents' + ': write',
              'git ' + 'push',
              'git ' + 'commit',
              'pull_request' + '_target',
              'repository: Rhodan-lab/' + 'Atlas',
              'cu' + 'rl ',
              'wg' + 'et ',
          )
          assert 'contents: read' in workflow
          for token in forbidden:
              assert token not in workflow, token
          PY
