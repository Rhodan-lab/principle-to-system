name: Recover Advisory Only Observation

on:
  pull_request:
    paths:
      - "PRODUCT_STATE.md"
      - "software/product_alpha/**"
      - "software/tests/test_product_alpha*.py"
      - ".github/workflows/recover-advisory-only-observation.yml"

permissions:
  contents: read

jobs:
  recover:
    if: github.head_ref == 'agent/make-optional-observation-advisory-only'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/make-optional-observation-advisory-only
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply precise advisory-only migration
        run: |
          if grep -q 'optional-advisory-review' software/product_alpha/evaluation/prepare_review.py && \
             grep -q 'test_optional_observation_rejects_planning_advance' software/tests/test_product_alpha_human_decision.py; then
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          path = Path("software/product_alpha/_make_optional_observation_advisory_only.py")
          text = path.read_text(encoding="utf-8")
          scan_old = 'if path != product_state and "advance-to-next-product-planning-review" in text:'
          scan_new = 'if path in (review, record, handoff, status, workspace) and "advance-to-next-product-planning-review" in text:'
          if text.count(scan_old) != 1:
              raise SystemExit(f"transformer scan guard: expected one anchor, found {text.count(scan_old)}")
          text = text.replace(scan_old, scan_new, 1)

          decision_old = '''replace_once(
              record,
              '        "evidence_status": readiness["evidence_status"],\\n        "sessions": readiness["sessions"],',
              '        "evidence_status": readiness["evidence_status"],\\n        "sessions": readiness["sessions"],\\n        "observation_mode": "optional-descriptive",\\n        "advisory_only": True,\\n        "roadmap_gate": False,\\n        "decision_authority": False,',
              "decision top-level advisory fields",
          )'''
          decision_new = '''replace_once(
              record,
              '        "evidence_status": readiness["evidence_status"],\\n        "sessions": readiness["sessions"],\\n        "review_packet_binding": {',
              '        "evidence_status": readiness["evidence_status"],\\n        "sessions": readiness["sessions"],\\n        "observation_mode": "optional-descriptive",\\n        "advisory_only": True,\\n        "roadmap_gate": False,\\n        "decision_authority": False,\\n        "review_packet_binding": {',
              "decision top-level advisory fields",
          )'''
          if text.count(decision_old) != 1:
              raise SystemExit(f"decision record transformer block: expected one anchor, found {text.count(decision_old)}")
          text = text.replace(decision_old, decision_new, 1)

          handoff_old = """replace_once(
              handoff,
              '''    boundaries = packet.get(\"boundaries\")
              if not isinstance(boundaries, dict):
                  raise ValueError(\"review packet boundaries must be an object\")''',
              '''    review = packet.get(\"review\")
              if not isinstance(review, dict):
                  raise ValueError(\"review packet review must be an object\")
              for key, expected in (
                  (\"planning_review_eligible\", False),
                  (\"advisory_only\", True),
                  (\"roadmap_gate\", False),
                  (\"decision_authority\", False),
              ):
                  if review.get(key) is not expected:
                      raise ValueError(f\"review packet advisory field {key!r} is invalid\")
              boundaries = packet.get(\"boundaries\")
              if not isinstance(boundaries, dict):
                  raise ValueError(\"review packet boundaries must be an object\")''',
              \"handoff review advisory validation\",
          )"""
          handoff_new = """replace_once(
              handoff,
              '''    summary = packet.get(\"aggregate_summary\")
              boundaries = packet.get(\"boundaries\")
              if not isinstance(summary, dict) or set(summary) != SAFE_SUMMARY_KEYS:
                  raise ValueError(\"review packet aggregate summary fields are not handoff-safe\")
              if not isinstance(boundaries, dict):
                  raise ValueError(\"review packet boundaries must be an object\")''',
              '''    summary = packet.get(\"aggregate_summary\")
              review = packet.get(\"review\")
              boundaries = packet.get(\"boundaries\")
              if not isinstance(summary, dict) or set(summary) != SAFE_SUMMARY_KEYS:
                  raise ValueError(\"review packet aggregate summary fields are not handoff-safe\")
              if not isinstance(review, dict):
                  raise ValueError(\"review packet review must be an object\")
              for key, expected in (
                  (\"planning_review_eligible\", False),
                  (\"advisory_only\", True),
                  (\"roadmap_gate\", False),
                  (\"decision_authority\", False),
              ):
                  if review.get(key) is not expected:
                      raise ValueError(f\"review packet advisory field {key!r} is invalid\")
              if not isinstance(boundaries, dict):
                  raise ValueError(\"review packet boundaries must be an object\")''',
              \"handoff review advisory validation\",
          )"""
          if text.count(handoff_old) != 1:
              raise SystemExit(f"handoff transformer block: expected one anchor, found {text.count(handoff_old)}")
          path.write_text(text.replace(handoff_old, handoff_new, 1), encoding="utf-8")
          PY
          python3 software/product_alpha/_make_optional_observation_advisory_only.py
      - name: Validate advisory-only authority boundary
        env:
          PYTHONWARNINGS: error::SyntaxWarning
        run: |
          python3 -m py_compile \
            software/product_alpha/evaluation/prepare_review.py \
            software/product_alpha/evaluation/record_decision.py \
            software/product_alpha/evaluation/prepare_handoff.py \
            software/product_alpha/evaluation/workspace_status.py \
            software/product_alpha/evaluation/prepare_workspace.py
          node --test software/tests/test_product_alpha*.mjs
          python3 -m unittest discover -s software/tests -p 'test_product_alpha*.py' -v
          python3 software/product_alpha/build.py check --route refrigerator
          python3 software/product_alpha/build.py check --route distributed-information
          python3 software/product_alpha/run_pilot.py check --route refrigerator
          python3 software/product_alpha/run_pilot.py check --route distributed-information
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "PRODUCT_STATE.md software/product_alpha/PILOT.md software/product_alpha/evaluation/prepare_handoff.py software/product_alpha/evaluation/prepare_review.py software/product_alpha/evaluation/prepare_workspace.py software/product_alpha/evaluation/record_decision.py software/product_alpha/evaluation/workspace_status.py software/tests/test_product_alpha_handoff.py software/tests/test_product_alpha_human_decision.py software/tests/test_product_alpha_review_packet.py software/tests/test_product_alpha_state_authority.py software/tests/test_product_alpha_workspace_status.py "
      - name: Commit advisory-only authority boundary
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            PRODUCT_STATE.md \
            software/product_alpha/PILOT.md \
            software/product_alpha/evaluation/prepare_review.py \
            software/product_alpha/evaluation/record_decision.py \
            software/product_alpha/evaluation/prepare_handoff.py \
            software/product_alpha/evaluation/workspace_status.py \
            software/product_alpha/evaluation/prepare_workspace.py \
            software/tests/test_product_alpha_review_packet.py \
            software/tests/test_product_alpha_human_decision.py \
            software/tests/test_product_alpha_handoff.py \
            software/tests/test_product_alpha_workspace_status.py \
            software/tests/test_product_alpha_state_authority.py
          git commit -m "Make optional observation artifacts advisory only"
          git push origin HEAD:agent/make-optional-observation-advisory-only
