name: Validate Principia Atlas Orchestration

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  ATLAS_COMMIT: 750933883996cc0759cfa40931db6cd262b13b07
  RELEASE_VERSION: 0.1.0-alpha.1
  PROMOTION_TAG: principia-atlas-v0.1.0-alpha.1

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Principia
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out pinned Atlas product input
        uses: actions/checkout@v4
        with:
          repository: Rhodan-lab/Atlas
          ref: ${{ env.ATLAS_COMMIT }}
          path: atlas
          persist-credentials: false

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: atlas/tools/foundation-validator/requirements.txt

      - name: Install pinned Atlas dependencies
        run: python3 -m pip install -r atlas/tools/foundation-validator/requirements.txt

      - name: Isolate Atlas from the Principia worktree
        run: mv atlas "$RUNNER_TEMP/atlas"

      - name: Compile orchestration, release, promotion, and hosted layers
        run: |
          python3 -m py_compile software/principia_atlas/suite.py
          python3 -m py_compile software/principia_atlas/orchestrate.py
          python3 -m py_compile software/principia_atlas/release.py
          python3 -m py_compile software/principia_atlas/release_runtime.py
          python3 -m py_compile software/principia_atlas/promotion_policy.py
          python3 -m py_compile software/principia_atlas/promotion.py
          python3 -m py_compile software/principia_atlas/hosted_catalog.py
          python3 -m py_compile software/principia_atlas/hosted_store.py
          python3 -m py_compile software/tests/test_product_alpha_principia_atlas_bundle.py
          python3 -m py_compile software/tests/test_product_alpha_principia_atlas_orchestration.py
          python3 -m py_compile software/tests/test_product_alpha_principia_atlas_release.py
          python3 -m py_compile software/tests/test_product_alpha_principia_atlas_promotion.py
          python3 -m py_compile software/tests/test_product_alpha_principia_atlas_hosted_catalog.py
          python3 -m py_compile software/tests/test_product_alpha_principia_atlas_hosted_store.py
          for file in software/principia_atlas/hosted/*.mjs; do node --check "$file"; done
          node --check software/tests/test_product_alpha_principia_atlas_hosted_state.mjs

      - name: Run orchestration regressions
        run: |
          python3 -m unittest discover \
            -s software/tests \
            -p 'test_product_alpha_principia_atlas_orchestration.py' \
            -v

      - name: Run release regressions
        run: |
          python3 -m unittest discover \
            -s software/tests \
            -p 'test_product_alpha_principia_atlas_release.py' \
            -v

      - name: Run promotion regressions
        run: |
          python3 -m unittest discover \
            -s software/tests \
            -p 'test_product_alpha_principia_atlas_promotion.py' \
            -v

      - name: Run hosted control-plane, state, and store regressions
        run: |
          node --test \
            software/tests/test_product_alpha_principia_atlas_hosted.mjs \
            software/tests/test_product_alpha_principia_atlas_hosted_state.mjs \
            software/tests/test_product_alpha_principia_atlas_hosted_serving.mjs
          python3 -m unittest discover \
            -s software/tests \
            -p 'test_product_alpha_principia_atlas_hosted_catalog.py' \
            -v
          python3 -m unittest discover \
            -s software/tests \
            -p 'test_product_alpha_principia_atlas_hosted_store.py' \
            -v

      - name: Verify deterministic end-to-end assembly
        run: |
          python3 software/principia_atlas/orchestrate.py check \
            --atlas-repo "$RUNNER_TEMP/atlas" \
            --route distributed-information \
            --expected-principia-commit "$(git rev-parse HEAD)" \
            --expected-atlas-commit "$ATLAS_COMMIT"

      - name: Build one versioned release
        run: |
          python3 software/principia_atlas/release.py build \
            --atlas-repo "$RUNNER_TEMP/atlas" \
            --route distributed-information \
            --version "$RELEASE_VERSION" \
            --expected-principia-commit "$(git rev-parse HEAD)" \
            --expected-atlas-commit "$ATLAS_COMMIT" \
            --product-output "$RUNNER_TEMP/principia-atlas-product" \
            --output "$RUNNER_TEMP/principia-atlas-$RELEASE_VERSION.zip"

      - name: Verify product and source receipt
        run: |
          python3 software/principia_atlas/orchestrate.py verify \
            --output "$RUNNER_TEMP/principia-atlas-product"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          output = Path(os.environ["RUNNER_TEMP"]) / "principia-atlas-product"
          receipt = json.loads(
              output.with_name(output.name + ".build-receipt.json").read_text(
                  encoding="utf-8"
              )
          )
          principia_commit = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          clean_status = hashlib.sha256(b"").hexdigest()
          assert receipt["contract"] == "principia-atlas-orchestration-receipt/0.2"
          assert receipt["sources"]["principia"]["commit"] == principia_commit
          assert receipt["sources"]["principia"]["clean"] is True
          assert receipt["sources"]["principia"]["status_sha256"] == clean_status
          assert receipt["sources"]["atlas"]["commit"] == os.environ["ATLAS_COMMIT"]
          assert receipt["sources"]["atlas"]["clean"] is True
          assert receipt["sources"]["atlas"]["status_sha256"] == clean_status
          assert receipt["boundaries"]["authorities_separate"] is True
          assert receipt["boundaries"]["status_inheritance"] == "prohibited"
          print("orchestration-receipt=" + receipt["receipt_id"])
          PY

      - name: Verify deterministic release archive
        run: |
          python3 software/principia_atlas/release.py check \
            --product "$RUNNER_TEMP/principia-atlas-product" \
            --version "$RELEASE_VERSION"

      - name: Verify release archive and standalone runtime
        run: |
          python3 software/principia_atlas/release.py verify \
            --output "$RUNNER_TEMP/principia-atlas-$RELEASE_VERSION.zip"
          mkdir "$RUNNER_TEMP/release-extracted"
          python3 -m zipfile -e \
            "$RUNNER_TEMP/principia-atlas-$RELEASE_VERSION.zip" \
            "$RUNNER_TEMP/release-extracted"
          python3 \
            "$RUNNER_TEMP/release-extracted/principia-atlas-$RELEASE_VERSION/launcher.py" \
            verify

      - name: Prepare and verify promotion candidate
        run: |
          mkdir -p "$RUNNER_TEMP/promotion-history" "$RUNNER_TEMP/promotion"
          : > "$RUNNER_TEMP/expected-release-tags.txt"
          python3 software/principia_atlas/promotion.py prepare \
            --archive "$RUNNER_TEMP/principia-atlas-$RELEASE_VERSION.zip" \
            --tag "$PROMOTION_TAG" \
            --history-dir "$RUNNER_TEMP/promotion-history" \
            --expected-tags "$RUNNER_TEMP/expected-release-tags.txt" \
            --output-dir "$RUNNER_TEMP/promotion"
          python3 software/principia_atlas/promotion.py verify \
            --archive "$RUNNER_TEMP/principia-atlas-$RELEASE_VERSION.zip" \
            --promotion "$RUNNER_TEMP/promotion/principia-atlas-promotion.json" \
            --index "$RUNNER_TEMP/promotion/principia-atlas-release-index.json"

      - name: Build and verify hosted deployment inputs
        run: |
          mkdir -p \
            "$RUNNER_TEMP/hosted-promotion-history/$PROMOTION_TAG" \
            "$RUNNER_TEMP/hosted" \
            "$RUNNER_TEMP/hosted-archives"
          cp \
            "$RUNNER_TEMP/promotion/principia-atlas-promotion.json" \
            "$RUNNER_TEMP/hosted-promotion-history/$PROMOTION_TAG/principia-atlas-promotion.json"
          cp \
            "$RUNNER_TEMP/principia-atlas-$RELEASE_VERSION.zip" \
            "$RUNNER_TEMP/principia-atlas-$RELEASE_VERSION.zip.sha256" \
            "$RUNNER_TEMP/hosted-archives/"
          python3 software/principia_atlas/hosted_catalog.py build \
            --promotions "$RUNNER_TEMP/hosted-promotion-history" \
            --output "$RUNNER_TEMP/hosted/catalog.json"
          python3 software/principia_atlas/hosted_catalog.py verify \
            --catalog "$RUNNER_TEMP/hosted/catalog.json"
          node software/principia_atlas/hosted/config.mjs seal \
            --input software/principia_atlas/hosted/example-tenants.unsigned.json \
            --output "$RUNNER_TEMP/hosted/tenants.json"
          node software/principia_atlas/hosted/config.mjs verify \
            --input "$RUNNER_TEMP/hosted/tenants.json"
          python3 software/principia_atlas/hosted_store.py check \
            --catalog "$RUNNER_TEMP/hosted/catalog.json" \
            --archives "$RUNNER_TEMP/hosted-archives"
          python3 software/principia_atlas/hosted_store.py build \
            --catalog "$RUNNER_TEMP/hosted/catalog.json" \
            --archives "$RUNNER_TEMP/hosted-archives" \
            --output "$RUNNER_TEMP/hosted/store"
          python3 software/principia_atlas/hosted_store.py verify \
            --store "$RUNNER_TEMP/hosted/store" \
            --catalog "$RUNNER_TEMP/hosted/catalog.json"

      - name: Smoke authenticated actual hosted release with durable state
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          import {
            createControlPlaneServer,
            loadHostedStore,
            openSqliteAuthState,
            parseStrictJson,
            signIdentityAssertion,
            verifyTenantCatalogCompatibility,
          } from './software/principia_atlas/hosted/index.mjs';

          const root = process.env.RUNNER_TEMP;
          const catalog = parseStrictJson(await readFile(`${root}/hosted/catalog.json`), 'catalog');
          const config = parseStrictJson(await readFile(`${root}/hosted/tenants.json`), 'tenants');
          const verified = verifyTenantCatalogCompatibility(catalog, config);
          const store = await loadHostedStore(`${root}/hosted/store`, verified.catalog);
          const authState = openSqliteAuthState(`${root}/hosted/auth-state.sqlite`);
          const expected = store.releases.get(process.env.RELEASE_VERSION)?.files.get('index.html');
          assert.ok(expected);
          const now = 1_800_000_000;
          const identitySecret = 'ci-identity-secret-0123456789-abcdefghijklmnopqrstuvwxyz';
          const sessionSecret = 'ci-session-secret-0123456789-abcdefghijklmnopqrstuvwxyz';
          const server = createControlPlaneServer({
            catalog: verified.catalog,
            config: verified.config,
            store,
            authState,
            identitySecret,
            sessionSecret,
            now: () => now,
          });
          await new Promise((resolve) => server.listen(0, '127.0.0.1', resolve));
          try {
            const address = server.address();
            const base = `http://127.0.0.1:${address.port}`;
            const assertion = signIdentityAssertion({
              iss: verified.config.identity.issuer,
              aud: verified.config.identity.audience,
              sub: 'ci-learner',
              tenant_id: 'local-preview',
              roles: ['learner'],
              iat: now,
              exp: now + 180,
              jti: 'ci_assertion_identifier_1234',
            }, identitySecret, verified.config);
            const exchange = await fetch(`${base}/api/auth/exchange`, {
              method: 'POST',
              headers: { Authorization: `Bearer ${assertion}`, Origin: base },
            });
            assert.equal(exchange.status, 200);
            const cookie = exchange.headers.get('set-cookie').split(';')[0];
            const ready = await fetch(`${base}/readyz`);
            assert.equal(ready.status, 200);
            assert.equal((await ready.json()).auth_state.kind, 'sqlite');
            const releaseResponse = await fetch(`${base}/app/${process.env.RELEASE_VERSION}/`, {
              headers: { Cookie: cookie },
            });
            assert.equal(releaseResponse.status, 200);
            assert.match(releaseResponse.headers.get('content-type'), /^text\/html/);
            assert.equal(releaseResponse.headers.get('etag'), `"sha256-${expected.sha256}"`);
            assert.deepEqual(Buffer.from(await releaseResponse.arrayBuffer()), expected.raw);
            const missing = await fetch(`${base}/app/9.9.9/`, { headers: { Cookie: cookie } });
            assert.equal(missing.status, 404);
          } finally {
            await new Promise((resolve) => server.close(resolve));
            authState.close();
          }
          JS
          node software/principia_atlas/hosted/auth_state_cli.mjs stats \
            --state "$RUNNER_TEMP/hosted/auth-state.sqlite" \
            --now 1800000001 \
            > "$RUNNER_TEMP/hosted/auth-state-stats.json"
          node software/principia_atlas/hosted/auth_state_cli.mjs revoke-subject \
            --state "$RUNNER_TEMP/hosted/auth-state.sqlite" \
            --tenant local-preview \
            --subject ci-learner \
            --now 1800000002 \
            > "$RUNNER_TEMP/hosted/auth-state-revocation.json"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const root = process.env.RUNNER_TEMP;
          const stats = JSON.parse(await readFile(`${root}/hosted/auth-state-stats.json`, 'utf8'));
          const revoked = JSON.parse(await readFile(`${root}/hosted/auth-state-revocation.json`, 'utf8'));
          assert.equal(stats.result.active_sessions, 1);
          assert.equal(revoked.revoked_sessions, 1);
          JS
          rm -f \
            "$RUNNER_TEMP/hosted/auth-state.sqlite" \
            "$RUNNER_TEMP/hosted/auth-state.sqlite-shm" \
            "$RUNNER_TEMP/hosted/auth-state.sqlite-wal" \
            "$RUNNER_TEMP/hosted/auth-state-stats.json" \
            "$RUNNER_TEMP/hosted/auth-state-revocation.json"

      - name: Verify source checkout immutability
        run: |
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test -z "$(git -C "$RUNNER_TEMP/atlas" status --porcelain=v1 --untracked-files=all)"

      - name: Upload versioned release artifact
        uses: actions/upload-artifact@v4
        with:
          name: principia-atlas-release-${{ github.sha }}
          path: |
            ${{ runner.temp }}/principia-atlas-product/
            ${{ runner.temp }}/principia-atlas-product.build-receipt.json
            ${{ runner.temp }}/principia-atlas-${{ env.RELEASE_VERSION }}.zip
            ${{ runner.temp }}/principia-atlas-${{ env.RELEASE_VERSION }}.zip.sha256
            ${{ runner.temp }}/promotion/principia-atlas-promotion.json
            ${{ runner.temp }}/promotion/principia-atlas-release-index.json
            ${{ runner.temp }}/promotion/RELEASE-NOTES.md
            ${{ runner.temp }}/hosted/catalog.json
            ${{ runner.temp }}/hosted/tenants.json
            ${{ runner.temp }}/hosted/store/
          if-no-files-found: error
          retention-days: 14
