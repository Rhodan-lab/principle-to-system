name: Run Phase 40 Finalization Transition
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  transition:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 40 finalization branch
        uses: actions/checkout@v4
        with:
          ref: agent/finalize-phase-40-record
          fetch-depth: 0
      - name: Execute the reviewed transition and push
        run: |
          awk '/^          from pathlib import Path$/{flag=1} /^          PY$/{flag=0} flag{sub(/^          /,""); print}' .github/workflows/apply-phase-40-state-transition.yml > /tmp/apply_phase40.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/apply_phase40.py')
          text = path.read_text(encoding='utf-8')
          old = '''v=Path('scripts/validate_phase39_postmerge_record.py')
          text=v.read_text(encoding='utf-8')
          old='f"Next gate: **{NEXT}**",'
          new='"Historical Phase 40 target marker: `offline-consequence-plan-review-response-intake-envelope-validation-execution-authorization-decision-candidate-boundary-readiness-assurance-candidate`",'
          assert old in text
          v.write_text(text.replace(old,new,1),encoding='utf-8')'''
          new = '''v=Path('scripts/validate_phase39_postmerge_record.py')
          text=v.read_text(encoding='utf-8')
          old='f"Next gate: **{NEXT}**",'
          new='"Historical Phase 40 target marker: `offline-consequence-plan-review-response-intake-envelope-validation-execution-authorization-decision-candidate-boundary-readiness-assurance-candidate`",'
          if old in text:
              text=text.replace(old,new,1)
          elif new not in text:
              raise AssertionError('Phase 39 gate marker missing')
          v.write_text(text,encoding='utf-8')'''
          assert old in text
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          python3 /tmp/apply_phase40.py
          python3 scripts/validate_phase40_postmerge_record.py
          python3 scripts/validate_phase39_postmerge_record.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/apply-phase-40-state-transition.yml
          git add -u
          git commit -m 'Finalize Phase 40 project state'
          git push origin HEAD:agent/finalize-phase-40-record
      - name: Remove temporary main-branch triggers
        run: |
          git fetch origin main
          git switch -C main origin/main
          rm -f .github/workflows/run-phase-40-finalization-transition.yml
          rm -f .github/workflows/trigger-phase-40-finalization-transition.yml
          git add -u
          git commit -m 'Remove temporary Phase 40 transition triggers'
          git push origin HEAD:main
