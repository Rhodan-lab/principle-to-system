name: Validate Phase 8 Life and Earth systems

on:
  push:
    branches:
      - agent/phase-8-life-earth-review
    paths:
      - 'science/13-cells-bioenergetics/**'
      - 'science/14-dna-evolution/**'
      - 'science/15-ecosystems-complex-systems/**'
      - 'science/16-earth-planetary/**'
      - 'sources/**'
      - 'reports/phase-8-*'
      - 'scripts/**'
      - 'INDEX.md'
      - 'PROJECT_STATE.md'
      - '.github/workflows/validate-phase-8-life-earth.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-phase-8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out committed review
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate canonical metadata
        run: python3 scripts/normalize_module_metadata.py

      - name: Validate normalized source foundation
        run: |
          python3 scripts/normalize_source_ledger.py --check --strict
          python3 scripts/apply_verified_source_baseline.py --check

      - name: Validate Phase 6 continuity
        run: |
          python3 scripts/apply_foundations_review_sources.py --check
          python3 scripts/validate_foundations_continuity_phase8.py --allow-downstream-reviewed

      - name: Validate Phase 7 continuity
        run: |
          python3 scripts/apply_phase7_review_sources.py --check
          python3 scripts/finalize_phase7_review.py --check

      - name: Validate Phase 8 sources and content
        run: |
          python3 scripts/apply_phase8_review_sources.py --check
          python3 scripts/finalize_phase8_review.py --check
          python3 scripts/validate_phase8_life_earth_review.py

      - name: Verify Phase 8 deterministic idempotence
        shell: bash
        run: |
          python3 scripts/finalize_phase8_review.py --write
          git diff --exit-code -- \
            science/13-cells-bioenergetics \
            science/14-dna-evolution \
            science/15-ecosystems-complex-systems \
            science/16-earth-planetary \
            INDEX.md

      - name: Run repository structural validator
        run: python3 scripts/validate_repo.py

      - name: Verify Phase 8 audit records
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          review = Path('reports/phase-8-life-earth-review.md')
          source_report = Path('reports/phase-8-life-earth-sources.json')
          registry = Path('sources/phase-8-reviewed-sources.json')
          for path in (review, source_report, registry):
              assert path.is_file(), f'missing audit artifact: {path}'

          report = json.loads(source_report.read_text(encoding='utf-8'))
          assert report['registry_records'] == 10
          assert report['ledger_records_before'] == 121
          assert len(report['records_added']) == 10
          assert report['ledger_records_after'] == 131
          assert report['errors'] == []

          state = Path('PROJECT_STATE.md').read_text(encoding='utf-8')
          required = (
              'Phase 8 Life and Earth Systems review implemented and validated on draft PR #9',
              'Modules 13–16: **Reviewed**',
              'Modules 17–20: **Draft**',
              'The integrated ledger contains **131 records**',
          )
          for marker in required:
              assert marker in state, f'missing project-state marker: {marker}'
          PY
