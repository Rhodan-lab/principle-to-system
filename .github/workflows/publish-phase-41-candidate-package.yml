name: Publish Phase 41 Candidate Package

on:
  push:
    branches:
      - agent/phase-41-candidate-preparation-readiness
    paths:
      - .github/workflows/publish-phase-41-candidate-package.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-41-candidate-preparation-readiness
      - name: Materialize deterministic Phase 41 package
        shell: bash
        run: |
          set -euo pipefail
          cat .phase41-publish/chunk-*.b64 | base64 -d > /tmp/phase41-payload.tar.gz
          test "$(sha256sum /tmp/phase41-payload.tar.gz | cut -d' ' -f1)" = "624ef6ac0fdc083814819f64229c54bd76ae95a4e7270963689a18fd14ab27a6"
          tar -xzf /tmp/phase41-payload.tar.gz -C .
          test "$(sha256sum release/phase-41-offline-consequence-plan-review-response-intake-envelope-validation-execution-authorization-decision-candidate-preparation-readiness.json | cut -d' ' -f1)" = "c45f148554f66bf21db03fa446475e55746086a47da0bb56841b95012be1d33b"
          rm -rf .phase41-publish
          rm .github/workflows/publish-phase-41-candidate-package.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Phase 41 candidate-preparation readiness'
          git push origin HEAD:agent/phase-41-candidate-preparation-readiness
