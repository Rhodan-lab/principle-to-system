name: Apply Phase 39 State Transition
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  transition:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 39 finalization branch
        uses: actions/checkout@v4
        with:
          ref: agent/finalize-phase-39-record
          fetch-depth: 0
      - name: Apply and validate the lossless transition
        run: |
          python3 scripts/apply_phase39_state_transition.py
          python3 scripts/generate_phase39_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_decision_candidate_boundary_readiness.py --check
          python3 scripts/validate_phase39_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_decision_candidate_boundary_readiness.py
          python3 scripts/validate_phase39_postmerge_record.py
          python3 scripts/validate_phase38_postmerge_record.py
      - name: Commit state and self-delete
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_STATE.md
          git rm scripts/apply_phase39_state_transition.py .github/workflows/apply-phase-39-state-transition.yml
          git commit -m 'Finalize the Phase 39 project-state transition'
          git push origin HEAD:agent/finalize-phase-39-record
