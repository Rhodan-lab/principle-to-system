name: Apply Phase 8 Life and Earth review

on:
  push:
    branches:
      - agent/phase-8-life-earth-review
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-phase-8-life-earth
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 8 branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-8-life-earth-review
          fetch-depth: 0

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply reviewed source records
        run: python3 scripts/apply_phase8_review_sources.py --write

      - name: Apply coordinated twelve-file review
        run: python3 scripts/apply_phase8_life_earth_review.py --write

      - name: Verify source and content idempotence
        run: |
          python3 scripts/apply_phase8_review_sources.py --check
          python3 scripts/apply_phase8_life_earth_review.py --check

      - name: Validate Phase 8 review contract
        run: python3 scripts/validate_phase8_life_earth_review.py

      - name: Validate repository structure
        run: python3 scripts/validate_repo.py

      - name: Commit reviewed files and audit records
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No Phase 8 changes remain.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'content: complete Phase 8 Life and Earth review'
          git push origin HEAD:agent/phase-8-life-earth-review
