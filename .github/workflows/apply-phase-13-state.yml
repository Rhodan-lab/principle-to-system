name: Apply Phase 13 Machine-Only State

on:
  push:
    branches:
      - agent/phase-13-software-foundation
    paths:
      - 'scripts/apply_phase13_state.py'
      - '.github/workflows/apply-phase-13-state.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-phase-13-state
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 13 branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-13-software-foundation
          fetch-depth: 0

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply machine-only roadmap transition
        run: |
          python3 scripts/apply_phase13_state.py --write
          python3 scripts/apply_phase13_state.py --check
          python3 scripts/finalize_phase12_validation_record.py --check
          python3 -m py_compile scripts/apply_phase13_state.py

      - name: Commit state transition
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No Phase 13 state changes remain.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_STATE.md README.md AUDIT.md release/README.md
          git commit -m 'governance: activate machine-only Phase 13 progression'
          git pull --rebase origin agent/phase-13-software-foundation
          git push origin HEAD:agent/phase-13-software-foundation
