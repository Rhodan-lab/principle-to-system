name: Apply Phase 13 Machine-Only State

on:
  push:
    branches:
      - agent/phase-13-software-foundation
    paths:
      - 'scripts/apply_phase13_state.py'
      - 'scripts/finalize_phase13_phase12_history.py'
      - 'scripts/finalize_phase13_validation_record.py'
      - '.github/workflows/apply-phase-13-state.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/apply_phase13_state.py'
      - 'scripts/finalize_phase13_phase12_history.py'
      - 'scripts/finalize_phase13_validation_record.py'
      - '.github/workflows/apply-phase-13-state.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-phase-13-state
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && (github.event_name != 'pull_request' || github.head_ref == 'agent/phase-13-software-foundation')
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 13 branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-13-software-foundation
          fetch-depth: 0

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Finalize machine-only roadmap and validation record
        id: state_transition
        shell: bash
        run: |
          set +e
          {
            python3 scripts/apply_phase13_state.py --write &&
            python3 scripts/apply_phase13_state.py --check &&
            python3 scripts/finalize_phase13_phase12_history.py --write &&
            python3 scripts/finalize_phase13_phase12_history.py --check &&
            python3 scripts/finalize_phase12_validation_record.py --check &&
            python3 scripts/finalize_phase13_validation_record.py --write &&
            python3 scripts/finalize_phase13_validation_record.py --check &&
            python3 -m py_compile scripts/apply_phase13_state.py scripts/finalize_phase13_phase12_history.py scripts/finalize_phase13_validation_record.py
          } > phase13-state-transition.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat phase13-state-transition.log
          exit 0

      - name: Upload state-transition diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase13-state-transition-diagnostics
          path: phase13-state-transition.log

      - name: Stop on state-transition errors
        if: steps.state_transition.outputs.status != '0'
        run: exit 1

      - name: Commit finalized state
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No Phase 13 state changes remain.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_STATE.md README.md AUDIT.md release/README.md reports/phase-13-software-foundation.md
          git commit -m 'governance: finalize Phase 13 machine validation'
          git pull --rebase origin agent/phase-13-software-foundation
          git push origin HEAD:agent/phase-13-software-foundation
