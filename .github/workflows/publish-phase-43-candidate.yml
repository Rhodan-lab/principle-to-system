name: Publish Phase 43 candidate manifest

on:
  push:
    branches:
      - agent/phase-43-offline-authorization-decision-candidate-assembly-readiness
    paths:
      - ".github/workflows/publish-phase-43-candidate.yml"
      - "scripts/generate_phase43_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_decision_candidate_assembly_readiness.py"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-43-offline-authorization-decision-candidate-assembly-readiness

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate canonical manifest
        run: python3 scripts/generate_phase43_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_decision_candidate_assembly_readiness.py

      - name: Commit generated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/phase-43-offline-consequence-plan-review-response-intake-envelope-validation-execution-authorization-decision-candidate-assembly-readiness.json
          if git diff --cached --quiet; then
            echo "Manifest already canonical."
          else
            git commit -m "Generate Phase 43 assembly-readiness manifest"
            git push
          fi
