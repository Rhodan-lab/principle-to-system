name: Publish Phase 37 Candidate Package
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 37 branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-37-offline-consequence-plan-review-response-intake-envelope-validation-execution-authorization-decision-readiness
          fetch-depth: 0
      - name: Reconstruct and validate exact Phase 37 package
        run: |
          wc -c .phase37-payload-00 .phase37-payload-01
          cat .phase37-payload-00 .phase37-payload-01 | base64 -d > /tmp/phase37-package.tar.gz
          sha256sum /tmp/phase37-package.tar.gz
          tar -tzf /tmp/phase37-package.tar.gz
          tar -xzf /tmp/phase37-package.tar.gz -C .
          python3 scripts/generate_phase37_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_decision_readiness.py --check
          python3 scripts/validate_phase37_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_decision_readiness.py
          python3 -m unittest software.tests.test_phase37_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_decision_readiness -v
      - name: Commit exact non-workflow evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/generate_phase37_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_decision_readiness.py \
            scripts/validate_phase37_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_decision_readiness.py \
            software/tests/test_phase37_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_decision_readiness.py \
            reports/phase-37-offline-consequence-plan-review-response-intake-envelope-validation-execution-authorization-decision-readiness.md \
            release/phase-37-offline-consequence-plan-review-response-intake-envelope-validation-execution-authorization-decision-readiness.json
          git commit -m 'Add Phase 37 authorization-decision readiness evidence'
          git push origin HEAD:agent/phase-37-offline-consequence-plan-review-response-intake-envelope-validation-execution-authorization-decision-readiness
