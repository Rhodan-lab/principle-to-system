# Phase 37 finalized provenance validation is permanently enabled.
name: Validate Phase 37 Offline Consequence Plan Review Response Intake Envelope Validation Execution Authorization Decision Readiness
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Principia Phase 37 evidence
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Phase 37 and inherited validators
        run: |
          python3 -m py_compile \
            scripts/generate_phase37_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_decision_readiness.py \
            scripts/validate_phase37_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_decision_readiness.py \
            scripts/validate_phase37_postmerge_record.py \
            scripts/validate_phase36_postmerge_record.py \
            scripts/generate_phase36_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_readiness_assurance.py \
            scripts/validate_phase36_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_readiness_assurance.py \
            scripts/validate_phase35_postmerge_record.py
      - name: Run complete Phase 37 chain
        run: |
          python3 scripts/generate_phase37_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_decision_readiness.py --check
          python3 scripts/validate_phase37_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_decision_readiness.py
          python3 scripts/validate_phase37_postmerge_record.py
          python3 -m unittest software.tests.test_phase37_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_decision_readiness -v
          python3 scripts/validate_phase36_postmerge_record.py
          python3 scripts/generate_phase36_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_readiness_assurance.py --check
          python3 scripts/validate_phase36_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_readiness_assurance.py
          python3 -m unittest software.tests.test_phase36_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_readiness_assurance -v
          python3 scripts/validate_phase35_postmerge_record.py
          python3 -m unittest discover -s software/tests -v
          python3 scripts/validate_phase13_software.py
      - name: Upload complete Phase 37 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-37-authorization-decision-readiness-diagnostics
          path: |
            release/phase-37-offline-consequence-plan-review-response-intake-envelope-validation-execution-authorization-decision-readiness.json
            release/phase-37-postmerge.json
            reports/phase-37-offline-consequence-plan-review-response-intake-envelope-validation-execution-authorization-decision-readiness.md
      - name: Verify permanent workflow immutability
        run: |
          git diff --exit-code -- . ':(exclude)**/__pycache__/**' ':(exclude)**/*.pyc'
          git diff --cached --exit-code -- . ':(exclude)**/__pycache__/**' ':(exclude)**/*.pyc'
          test -z "$(git status --porcelain --untracked-files=all | grep -Ev '(__pycache__/|\.pyc$)' || true)"
