name: Trigger Phase 42 Next-Gate Fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-phase-42-next-gate
          fetch-depth: 0
      - name: Apply and validate correction
        run: |
          python3 scripts/fix_phase42_next_gate.py
          python3 scripts/validate_phase42_postmerge_record.py
      - name: Commit clean correction branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f scripts/fix_phase42_next_gate.py
          git add -u
          git commit -m 'Correct Phase 42 authoritative next gate'
          git push origin HEAD:agent/fix-phase-42-next-gate
      - name: Remove this trigger from main
        run: |
          git fetch origin main
          git switch -C main origin/main
          rm -f .github/workflows/trigger-phase-42-next-gate-fix.yml
          git add -u
          git commit -m 'Remove temporary Phase 42 next-gate trigger'
          git push origin HEAD:main
