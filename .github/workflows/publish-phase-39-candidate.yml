name: Remove Temporary Phase 39 Publisher
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 39 branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-39-offline-consequence-plan-review-response-intake-envelope-validation-execution-authorization-decision-candidate-boundary-readiness
          fetch-depth: 0
      - name: Remove temporary publisher and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/publish-phase-39-candidate.yml
          git commit -m 'Remove temporary Phase 39 candidate publisher'
          git push origin HEAD:agent/phase-39-offline-consequence-plan-review-response-intake-envelope-validation-execution-authorization-decision-candidate-boundary-readiness
