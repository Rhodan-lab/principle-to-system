name: Apply Bridge Candidate Validator Transitions

on:
  push:
    branches:
      - agent/bridge-candidate-delayed-correction-r2
    paths:
      - 'scripts/apply_bridge_candidate_validator_transitions.py'
      - 'scripts/finalize_bridge_candidate_records.py'
      - '.github/workflows/apply-bridge-candidate-validator-transitions.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/apply_bridge_candidate_validator_transitions.py'
      - 'scripts/finalize_bridge_candidate_records.py'
      - '.github/workflows/apply-bridge-candidate-validator-transitions.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-bridge-candidate-validator-transitions
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && (github.event_name != 'pull_request' || github.head_ref == 'agent/bridge-candidate-delayed-correction-r2')
    runs-on: ubuntu-latest
    steps:
      - name: Check out bridge candidate branch
        uses: actions/checkout@v4
        with:
          ref: agent/bridge-candidate-delayed-correction-r2
          fetch-depth: 0

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply deterministic candidate transitions
        id: transition
        shell: bash
        run: |
          set +e
          {
            python3 scripts/apply_bridge_candidate_validator_transitions.py --write &&
            python3 scripts/apply_bridge_candidate_validator_transitions.py --check &&
            python3 scripts/finalize_bridge_candidate_records.py --write &&
            python3 scripts/finalize_bridge_candidate_records.py --check &&
            python3 -m py_compile \
              scripts/apply_bridge_candidate_validator_transitions.py \
              scripts/finalize_bridge_candidate_records.py \
              scripts/validate_phase11b_expansion.py \
              scripts/validate_phase12_release_candidate.py
          } > bridge-candidate-transition.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat bridge-candidate-transition.log
          exit 0

      - name: Upload bridge transition diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bridge-candidate-transition-diagnostics
          path: bridge-candidate-transition.log

      - name: Stop on transition errors
        if: steps.transition.outputs.status != '0'
        run: exit 1

      - name: Commit candidate transitions
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No candidate transitions remain.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/validate_phase11b_expansion.py \
            scripts/validate_phase12_release_candidate.py \
            PROJECT_STATE.md README.md AUDIT.md release/README.md
          git commit -m 'bridge: finalize non-live exact-revision candidate'
          git pull --rebase origin agent/bridge-candidate-delayed-correction-r2
          git push origin HEAD:agent/bridge-candidate-delayed-correction-r2
