name: Remove Temporary Phase 40 Publisher
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 40 branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-40-offline-consequence-plan-review-response-intake-envelope-validation-execution-authorization-decision-candidate-boundary-readiness-assurance
          fetch-depth: 0
      - name: Remove temporary transport and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f phase40-package.b64 .github/workflows/publish-phase-40-candidate.yml
          git add -u
          git commit -m 'Remove temporary Phase 40 publisher and payload'
          git push origin HEAD:agent/phase-40-offline-consequence-plan-review-response-intake-envelope-validation-execution-authorization-decision-candidate-boundary-readiness-assurance
