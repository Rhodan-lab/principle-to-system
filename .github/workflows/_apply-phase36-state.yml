name: Apply Phase 36 State Transition
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/finalize-phase-36-record'
    runs-on: ubuntu-latest
    steps:
      - name: Check out finalization branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply exact Phase 36 state transition
        run: |
          python3 scripts/apply_phase36_state.py
          python3 scripts/validate_phase36_postmerge_record.py
      - name: Remove one-shot transition machinery
        run: |
          rm scripts/apply_phase36_state.py
          rm .github/workflows/_apply-phase36-state.yml
      - name: Commit state transition to branch
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATE.md
          git add -u scripts/apply_phase36_state.py .github/workflows/_apply-phase36-state.yml
          git commit -m "Finalize Phase 36 project state"
          git push origin "HEAD:${BRANCH}"
