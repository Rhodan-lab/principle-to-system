name: Finalize Phase 43 state once

on:
  push:
    branches:
      - agent/finalize-phase-43-candidate-assembly-readiness
    paths:
      - "scripts/finalize_phase43_state_once.py"
      - ".github/workflows/finalize-phase-43-state-once.yml"

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out finalization branch
        uses: actions/checkout@v4
        with:
          ref: agent/finalize-phase-43-candidate-assembly-readiness
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Materialize marker-checked state transition
        run: python3 scripts/finalize_phase43_state_once.py

      - name: Compile permanent validation chain
        run: |
          python3 -m py_compile \
            scripts/generate_phase43_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_decision_candidate_assembly_readiness.py \
            scripts/validate_phase43_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_decision_candidate_assembly_readiness.py \
            scripts/validate_phase43_postmerge_record.py \
            scripts/validate_phase42_postmerge_record.py

      - name: Validate finalized Phase 43 state
        run: |
          python3 scripts/generate_phase43_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_decision_candidate_assembly_readiness.py --check
          python3 scripts/validate_phase43_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_decision_candidate_assembly_readiness.py
          python3 scripts/validate_phase43_postmerge_record.py
          python3 -m unittest software.tests.test_phase43_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_decision_candidate_assembly_readiness -v
          python3 scripts/validate_phase42_postmerge_record.py

      - name: Verify self-removal and bounded diff
        run: |
          test ! -e scripts/finalize_phase43_state_once.py
          test ! -e .github/workflows/finalize-phase-43-state-once.yml
          git diff --check
          git status --short

      - name: Commit permanent Phase 43 finalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Phase 43 candidate assembly readiness"
          git push origin HEAD:agent/finalize-phase-43-candidate-assembly-readiness
