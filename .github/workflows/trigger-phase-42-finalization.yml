name: Trigger Phase 42 Finalization
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out finalization branch
        uses: actions/checkout@v4
        with:
          ref: agent/finalize-phase-42-record
          fetch-depth: 0
      - name: Apply and validate Phase 42 transition
        run: |
          python3 scripts/apply_phase42_state_transition.py
          python3 scripts/validate_phase42_postmerge_record.py
          python3 scripts/validate_phase41_postmerge_record.py
      - name: Commit clean finalization branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f scripts/apply_phase42_state_transition.py
          rm -f .github/workflows/apply-phase-42-state-transition.yml
          git add -u
          git commit -m 'Finalize Phase 42 project state'
          git push origin HEAD:agent/finalize-phase-42-record
      - name: Remove this trigger from main
        run: |
          git fetch origin main
          git switch -C main origin/main
          rm -f .github/workflows/trigger-phase-42-finalization.yml
          git add -u
          git commit -m 'Remove temporary Phase 42 finalization trigger'
          git push origin HEAD:main
