name: Apply Phase 37 State Transition
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out finalization branch
        uses: actions/checkout@v4
        with:
          ref: agent/finalize-phase-37-record
          fetch-depth: 0
      - name: Apply exact Phase 37 state transition
        run: |
          python3 scripts/apply_phase37_state_transition.py
          python3 -m py_compile scripts/validate_phase36_postmerge_record.py scripts/validate_phase37_postmerge_record.py
      - name: Remove one-shot transition machinery
        run: |
          rm scripts/apply_phase37_state_transition.py
          rm .github/workflows/apply-phase-37-state-transition.yml
      - name: Commit state transition to branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898242+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'Finalize Phase 37 project state'
          git push origin HEAD:agent/finalize-phase-37-record
