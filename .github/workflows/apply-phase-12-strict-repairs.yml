name: Apply Phase 12 Strict Repairs

on:
  push:
    branches:
      - agent/phase-12-release-candidate
    paths:
      - 'scripts/apply_phase12_strict_repairs.py'
      - '.github/workflows/apply-phase-12-strict-repairs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-phase-12-strict-repairs
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 12 branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-12-release-candidate
          fetch-depth: 0

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply deterministic strict repairs
        run: |
          python3 scripts/apply_phase12_strict_repairs.py --write
          python3 scripts/apply_phase12_strict_repairs.py --check
          python3 -m py_compile scripts/apply_phase12_strict_repairs.py
          python3 -m py_compile scripts/validate_repo.py

      - name: Run strict repository validation
        shell: bash
        run: |
          set +e
          python3 scripts/validate_repo.py --strict > strict-repair-result.log 2>&1
          status=$?
          cat strict-repair-result.log
          echo "Strict validation status after deterministic repairs: $status"
          exit 0

      - name: Commit deterministic repairs
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No strict repairs remain.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/validate_repo.py science/09-motion-forces/overview.md science/09-motion-forces/technology.md science/09-motion-forces/explore.md
          git commit -m 'release: normalize Phase 12 strict content contracts'
          git push origin HEAD:agent/phase-12-release-candidate
