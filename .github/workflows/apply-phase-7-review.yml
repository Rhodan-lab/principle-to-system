name: Apply Phase 7 physical science review

on:
  push:
    branches:
      - agent/phase-7-physical-science-review
  pull_request:
    branches:
      - main
      - agent/phase-6-foundations-review
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-phase-7-review
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 7 branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-7-physical-science-review
          fetch-depth: 0

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore reviewed Phase 6 layer
        shell: bash
        run: |
          git fetch origin agent/phase-6-foundations-review
          git checkout origin/agent/phase-6-foundations-review -- \
            foundations/01-scientific-reasoning \
            foundations/02-measurement-uncertainty \
            foundations/03-mathematical-models \
            foundations/04-probability-statistics \
            foundations/05-computation-algorithms \
            INDEX.md \
            PROJECT_STATE.md \
            sources/source-ledger.md \
            sources/foundations-review-sources.json \
            reports/phase-6-foundations-review.md \
            reports/phase-6-foundations-sources.json \
            scripts/apply_foundations_review_sources.py \
            scripts/validate_foundations_review.py \
            .github/workflows/validate-phase-6-foundations.yml

      - name: Apply reviewed source registries
        run: |
          python3 scripts/apply_foundations_review_sources.py --write
          python3 scripts/apply_phase7_review_sources.py --write

      - name: Apply final reviewed physical-science content
        id: transform
        shell: bash
        run: |
          set +e
          python3 scripts/finalize_phase7_review.py --write > phase7-transform.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat phase7-transform.log
          exit 0

      - name: Upload transformer diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: phase7-transform-diagnostics
          path: phase7-transform.log

      - name: Stop on transformation errors
        if: steps.transform.outputs.status != '0'
        run: exit 1

      - name: Verify Phase 6 and Phase 7 reviewed state
        run: |
          python3 scripts/apply_foundations_review_sources.py --check
          python3 scripts/validate_foundations_review.py
          python3 scripts/apply_phase7_review_sources.py --check
          python3 scripts/finalize_phase7_review.py --check

      - name: Commit integrated reviewed layers
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No integrated review changes remain.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            foundations/01-scientific-reasoning \
            foundations/02-measurement-uncertainty \
            foundations/03-mathematical-models \
            foundations/04-probability-statistics \
            foundations/05-computation-algorithms \
            science/06-matter-quantum \
            science/07-chemical-bonding \
            science/08-energy-thermodynamics \
            science/09-motion-forces \
            science/10-electricity-magnetism \
            science/11-waves-signals \
            science/12-fluids-materials \
            INDEX.md PROJECT_STATE.md \
            sources/source-ledger.md sources/foundations-review-sources.json \
            reports/phase-6-foundations-review.md reports/phase-6-foundations-sources.json \
            reports/phase-7-physical-science-sources.json \
            scripts/apply_foundations_review_sources.py scripts/validate_foundations_review.py \
            .github/workflows/validate-phase-6-foundations.yml
          git commit -m 'content: integrate reviewed Foundations and Physical Science layers'
          git push origin HEAD:agent/phase-7-physical-science-review
