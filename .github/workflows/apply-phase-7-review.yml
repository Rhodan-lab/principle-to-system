name: Apply Phase 7 physical science review

on:
  push:
    branches:
      - agent/phase-7-physical-science-review
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-phase-7-review
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 7 branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-7-physical-science-review
          fetch-depth: 0

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply direct reviewed sources
        run: python3 scripts/apply_phase7_review_sources.py --write

      - name: Apply reviewed physical-science content
        id: transform
        shell: bash
        run: |
          set +e
          python3 scripts/run_phase7_review.py --write > phase7-transform.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat phase7-transform.log
          exit 0

      - name: Upload transformer diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: phase7-transform-diagnostics
          path: phase7-transform.log

      - name: Stop on transformation errors
        if: steps.transform.outputs.status != '0'
        run: exit 1

      - name: Verify source and content idempotence
        run: |
          python3 scripts/apply_phase7_review_sources.py --check
          python3 scripts/run_phase7_review.py --check

      - name: Commit reviewed files and source records
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No Phase 7 changes remain.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add science/06-matter-quantum science/07-chemical-bonding science/08-energy-thermodynamics science/09-motion-forces science/10-electricity-magnetism science/11-waves-signals science/12-fluids-materials INDEX.md sources/source-ledger.md reports/phase-7-physical-science-sources.json
          git commit -m 'content: strengthen Phase 7 review and sources'
          git push origin HEAD:agent/phase-7-physical-science-review
