name: Validate Phase 15 Offline Pilot

on:
  push:
    branches:
      - agent/phase-15-offline-integration-pilot
      - agent/finalize-phase-15-record
    paths:
      - 'integration/principia-atlas/**'
      - 'release/phase-15-offline-pilot.json'
      - 'reports/phase-15-offline-integration-pilot.md'
      - 'scripts/generate_phase15_offline_pilot.py'
      - 'scripts/validate_phase15_offline_pilot.py'
      - 'scripts/validate_phase15_postmerge_record.py'
      - 'scripts/finalize_phase15_state.py'
      - 'software/tests/test_phase15_offline_pilot.py'
      - 'PROJECT_STATE.md'
      - '.github/workflows/validate-phase-15-offline-pilot.yml'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'software/product_alpha/**'
      - 'software/tests/test_product_alpha*.py'
      - 'software/tests/test_product_alpha*.mjs'
      - '.github/workflows/validate-product-alpha.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-phase-15-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Principia offline pilot
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Phase 15 and inherited validators
        run: |
          python3 -m py_compile scripts/generate_phase15_offline_pilot.py
          python3 -m py_compile scripts/validate_phase15_offline_pilot.py
          python3 -m py_compile scripts/validate_phase15_postmerge_record.py
          python3 -m py_compile scripts/finalize_phase15_state.py
          python3 -m py_compile scripts/export_principia_atlas_dependents.py
          python3 -m py_compile scripts/validate_principia_atlas_bridge.py
          python3 -m py_compile scripts/validate_principia_atlas_audit.py
          python3 -m py_compile scripts/validate_phase12_release_candidate.py
          python3 -m py_compile scripts/validate_phase13_software.py
          python3 -m py_compile software/tests/test_phase15_offline_pilot.py

      - name: Run complete Phase 15 chain
        id: pilot_chain
        shell: bash
        run: |
          set +e
          status=0
          run_check() {
            printf '\n$'
            printf ' %q' "$@"
            printf '\n'
            "$@" || status=1
          }
          {
            run_check python3 scripts/finalize_phase15_state.py --check
            run_check python3 scripts/validate_phase15_postmerge_record.py
            run_check python3 scripts/generate_phase15_offline_pilot.py --check
            run_check python3 scripts/validate_phase15_offline_pilot.py
            run_check python3 scripts/finalize_bridge_candidate_records.py --check
            run_check python3 scripts/export_principia_atlas_dependents.py --check
            run_check python3 scripts/validate_principia_atlas_bridge.py
            run_check python3 scripts/validate_principia_atlas_audit.py
            run_check python3 scripts/validate_experiences.py --strict
            run_check python3 scripts/validate_phase11b_expansion.py
            run_check python3 scripts/validate_phase10_synthesis.py
            run_check python3 scripts/validate_phase10_audit.py
            run_check python3 scripts/validate_repo.py --strict
            run_check python3 scripts/validate_phase12_release_candidate.py
            run_check python3 -m unittest discover -s software/tests -v
            run_check python3 scripts/validate_phase13_software.py
          } > phase15-offline-pilot-validation.log 2>&1
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat phase15-offline-pilot-validation.log
          exit 0

      - name: Upload complete Phase 15 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase15-offline-pilot-validation-diagnostics
          path: phase15-offline-pilot-validation.log

      - name: Stop on Phase 15 errors
        if: steps.pilot_chain.outputs.status != '0'
        run: exit 1

      - name: Verify permanent workflow immutability
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/validate-phase-15-offline-pilot.yml').read_text(encoding='utf-8')
          forbidden = (
              'contents' + ': write',
              'git ' + 'push',
              'git ' + 'commit',
              'pull_request' + '_target',
              'repository: Rhodan-lab/' + 'Atlas',
              'cu' + 'rl ',
              'wg' + 'et ',
          )
          assert 'contents: read' in workflow
          for token in forbidden:
              assert token not in workflow, token
          PY
