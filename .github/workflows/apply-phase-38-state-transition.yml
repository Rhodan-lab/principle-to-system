name: Apply Phase 38 State Transition
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  transition:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 38 finalization branch
        uses: actions/checkout@v4
        with:
          ref: agent/finalize-phase-38-record
          fetch-depth: 0
      - name: Apply and validate the lossless transition
        run: |
          python3 .phase38_state_transition.py
          python3 scripts/validate_phase38_postmerge_record.py
          python3 scripts/validate_phase37_postmerge_record.py
      - name: Commit state and self-delete
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .phase38_state_transition.py .github/workflows/apply-phase-38-state-transition.yml
          git add PROJECT_STATE.md
          git add -u
          git commit -m 'Finalize Phase 38 project state'
          git push origin HEAD:agent/finalize-phase-38-record
