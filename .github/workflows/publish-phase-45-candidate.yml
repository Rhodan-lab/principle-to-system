name: Publish Phase 45 candidate

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/publish_phase45_candidate.py"
      - ".github/workflows/publish-phase-45-candidate.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-45-offline-authorization-decision-candidate-population-readiness
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish deterministic Phase 45 package
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          if [ ! -f scripts/publish_phase45_candidate.py ]; then
            echo "Publisher already removed."
            exit 0
          fi
          python3 scripts/publish_phase45_candidate.py
