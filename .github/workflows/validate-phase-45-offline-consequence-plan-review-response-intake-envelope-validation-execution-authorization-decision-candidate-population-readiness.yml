name: Validate Phase 45 candidate population readiness

on:
  pull_request:
    paths-ignore:
      - 'software/product_alpha/**'
      - 'software/tests/test_product_alpha*.py'
      - 'software/tests/test_product_alpha*.mjs'
      - '.github/workflows/validate-product-alpha.yml'
  push:
    paths-ignore:
      - 'software/product_alpha/**'
      - 'software/tests/test_product_alpha*.py'

      - 'software/tests/test_product_alpha*.mjs'
      - '.github/workflows/validate-product-alpha.yml'
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Phase 45 validation chain
        run: |
          python3 -m py_compile \
            scripts/generate_phase45_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_decision_candidate_population_readiness.py \
            scripts/validate_phase45_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_decision_candidate_population_readiness.py \
            scripts/validate_phase45_postmerge_record.py \
            scripts/validate_phase44_postmerge_record.py \
            scripts/validate_phase43_postmerge_record.py \
            scripts/validate_phase42_postmerge_record.py
      - name: Check deterministic candidate bytes
        run: python3 scripts/generate_phase45_*_population_readiness.py --check
      - name: Run independent Phase 45 validator
        run: python3 scripts/validate_phase45_*_population_readiness.py
      - name: Validate Phase 45 post-merge record
        run: python3 scripts/validate_phase45_postmerge_record.py
      - name: Run Phase 45 mutation tests
        run: python3 -m unittest discover -s software/tests -p 'test_phase45*population_readiness.py' -v
      - name: Revalidate Phase 44 finalization
        run: python3 scripts/validate_phase44_postmerge_record.py
      - name: Revalidate Phase 43 finalization
        run: python3 scripts/validate_phase43_postmerge_record.py
      - name: Revalidate Phase 42 finalization
        run: python3 scripts/validate_phase42_postmerge_record.py
      - name: Verify permanent workflow immutability
        run: |
          git diff --exit-code -- . ':(exclude)**/__pycache__/**' ':(exclude)**/*.pyc'
          git diff --cached --exit-code -- . ':(exclude)**/__pycache__/**' ':(exclude)**/*.pyc'
          test -z "$(git status --porcelain --untracked-files=all | grep -Ev '(__pycache__/|\.pyc$)' || true)"
