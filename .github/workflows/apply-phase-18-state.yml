name: Apply Phase 18 State

on:
  push:
    branches:
      - agent/phase-18-offline-reconciliation-simulation
    paths:
      - '.github/workflows/apply-phase-18-state.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-phase-18-state.yml'
      - 'scripts/finalize_phase18_state.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-phase-18-state
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 18 branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-18-offline-reconciliation-simulation
          fetch-depth: 0

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply and verify state transition
        run: |
          python3 scripts/finalize_phase18_state.py --write
          python3 scripts/finalize_phase18_state.py --check

      - name: Commit state transition
        shell: bash
        run: |
          if git diff --quiet -- PROJECT_STATE.md; then
            echo 'Phase 18 state already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_STATE.md
          git commit -m 'docs: activate Phase 18 reconciliation simulation'
          git push origin HEAD:agent/phase-18-offline-reconciliation-simulation
