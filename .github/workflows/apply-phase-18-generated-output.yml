name: Apply Phase 18 Generated Output

on:
  push:
    branches:
      - agent/phase-18-offline-reconciliation-simulation
    paths:
      - '.github/workflows/apply-phase-18-generated-output.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-phase-18-output
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 18 branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-18-offline-reconciliation-simulation
          fetch-depth: 0

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate deterministic reconciliation evidence
        run: |
          python3 scripts/generate_phase18_offline_reconciliation.py --write
          python3 scripts/generate_phase18_offline_reconciliation.py --check

      - name: Commit generated evidence
        shell: bash
        run: |
          targets=(
            integration/principia-atlas/pilot/thermal-control.reconciliation-report.v01.json
            integration/principia-atlas/pilot/thermal-control.reconciliation-checkpoint.v01.json
            integration/principia-atlas/pilot/thermal-control.reconciliation-recovery.v01.json
          )
          if git diff --quiet -- "${targets[@]}"; then
            echo 'Phase 18 outputs already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${targets[@]}"
          git commit -m 'integration: generate Phase 18 reconciliation evidence'
          git push origin HEAD:agent/phase-18-offline-reconciliation-simulation
