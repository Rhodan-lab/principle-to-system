name: Finalize Phase 15 State

on:
  push:
    branches:
      - agent/phase-15-offline-integration-pilot
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-phase-15-state
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-15-offline-integration-pilot

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Finalize and verify state
        run: |
          python3 scripts/finalize_phase15_state.py --write
          python3 scripts/finalize_phase15_state.py --check
          python3 scripts/generate_phase15_offline_pilot.py --check

      - name: Commit finalized state
        run: |
          if git diff --quiet -- PROJECT_STATE.md; then
            echo 'No state change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_STATE.md
          git commit -m 'docs: finalize Phase 15 offline pilot state'
          git push origin HEAD:agent/phase-15-offline-integration-pilot
