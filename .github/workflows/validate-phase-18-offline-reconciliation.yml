name: Validate Phase 18 Offline Reconciliation

on:
  push:
    branches:
      - agent/phase-18-offline-reconciliation-simulation
      - agent/finalize-phase-18-governance
    paths:
      - 'integration/principia-atlas/**'
      - 'release/phase-18-offline-reconciliation.json'
      - 'release/phase-18-postmerge.json'
      - 'reports/phase-18-offline-reconciliation.md'
      - 'scripts/generate_phase18_offline_reconciliation.py'
      - 'scripts/generate_phase18_release_record.py'
      - 'scripts/validate_phase18_offline_reconciliation.py'
      - 'scripts/validate_phase18_postmerge_record.py'
      - 'scripts/finalize_phase18_state.py'
      - 'software/tests/test_phase18_offline_reconciliation.py'
      - 'PROJECT_STATE.md'
      - '.github/workflows/validate-phase-18-offline-reconciliation.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-phase-18-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Principia Phase 18 candidate
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Phase 18 and inherited validators
        run: |
          python3 -m py_compile scripts/generate_phase18_offline_reconciliation.py
          python3 -m py_compile scripts/generate_phase18_release_record.py
          python3 -m py_compile scripts/validate_phase18_offline_reconciliation.py
          python3 -m py_compile scripts/validate_phase18_postmerge_record.py
          python3 -m py_compile scripts/finalize_phase18_state.py
          python3 -m py_compile scripts/generate_phase17_offline_event_protocol.py
          python3 -m py_compile scripts/validate_phase17_offline_event_protocol.py
          python3 -m py_compile scripts/validate_phase17_postmerge_record.py
          python3 -m py_compile scripts/validate_phase16_postmerge_record.py
          python3 -m py_compile scripts/validate_phase15_postmerge_record.py
          python3 -m py_compile scripts/validate_principia_atlas_bridge.py
          python3 -m py_compile scripts/validate_principia_atlas_audit.py
          python3 -m py_compile scripts/validate_phase12_release_candidate.py
          python3 -m py_compile scripts/validate_phase13_software.py
          python3 -m py_compile software/tests/test_phase18_offline_reconciliation.py

      - name: Run complete Phase 18 chain
        id: phase18_chain
        shell: bash
        run: |
          set +e
          status=0
          run_check() {
            printf '\n$'
            printf ' %q' "$@"
            printf '\n'
            "$@" || status=1
          }
          {
            run_check python3 scripts/finalize_phase18_state.py --check
            run_check python3 scripts/generate_phase18_offline_reconciliation.py --check
            run_check python3 scripts/generate_phase18_release_record.py --check
            run_check python3 scripts/validate_phase18_offline_reconciliation.py
            run_check python3 scripts/validate_phase18_postmerge_record.py
            run_check python3 -m unittest software.tests.test_phase18_offline_reconciliation -v
            run_check python3 scripts/validate_phase17_postmerge_record.py
            run_check python3 scripts/generate_phase17_offline_event_protocol.py --check
            run_check python3 scripts/validate_phase17_offline_event_protocol.py
            run_check python3 scripts/validate_phase16_postmerge_record.py
            run_check python3 scripts/generate_phase16_offline_multi_artifact.py --check
            run_check python3 scripts/validate_phase16_offline_multi_artifact.py
            run_check python3 scripts/finalize_phase15_state.py --check
            run_check python3 scripts/validate_phase15_postmerge_record.py
            run_check python3 scripts/generate_phase15_offline_pilot.py --check
            run_check python3 scripts/validate_phase15_offline_pilot.py
            run_check python3 scripts/export_principia_atlas_dependents.py --check
            run_check python3 scripts/finalize_bridge_candidate_records.py --check
            run_check python3 scripts/validate_principia_atlas_bridge.py
            run_check python3 scripts/validate_principia_atlas_audit.py
            run_check python3 scripts/validate_experiences.py --strict
            run_check python3 scripts/validate_phase11b_expansion.py
            run_check python3 scripts/validate_phase10_synthesis.py
            run_check python3 scripts/validate_phase10_audit.py
            run_check python3 scripts/validate_repo.py --strict
            run_check python3 scripts/validate_phase12_release_candidate.py
            run_check python3 -m unittest discover -s software/tests -v
            run_check python3 scripts/validate_phase13_software.py
          } > phase18-offline-reconciliation-validation.log 2>&1
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat phase18-offline-reconciliation-validation.log
          exit 0

      - name: Upload complete Phase 18 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase18-offline-reconciliation-validation-diagnostics
          path: phase18-offline-reconciliation-validation.log

      - name: Stop on Phase 18 errors
        if: steps.phase18_chain.outputs.status != '0'
        run: exit 1

      - name: Verify permanent workflow immutability
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/validate-phase-18-offline-reconciliation.yml').read_text(encoding='utf-8')
          forbidden = (
              'contents' + ': write',
              'git ' + 'push',
              'git ' + 'commit',
              'pull_request' + '_target',
              'repository: Rhodan-lab/' + 'Atlas',
              'cu' + 'rl ',
              'wg' + 'et ',
          )
          assert 'contents: read' in workflow
          for token in forbidden:
              assert token not in workflow, token
          PY
