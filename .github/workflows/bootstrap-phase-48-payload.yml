name: Bootstrap Phase 48 assurance payload

on:
  push:
    branches:
      - agent/phase-48-population-execution-readiness-assurance
    paths:
      - .github/workflows/bootstrap-phase-48-payload.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Materialize Phase 48 package
        shell: bash
        run: |
          cat > /tmp/phase48.b64 <<'B64'
          
          B64
          base64 -d /tmp/phase48.b64 | tar -xz
      - name: Validate package before commit
        run: |
          python3 -m py_compile \
            scripts/generate_phase48_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_decision_candidate_population_execution_readiness_assurance.py \
            scripts/validate_phase48_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_decision_candidate_population_execution_readiness_assurance.py
          python3 scripts/generate_phase48_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_decision_candidate_population_execution_readiness_assurance.py --check
          python3 scripts/validate_phase48_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_decision_candidate_population_execution_readiness_assurance.py
          python3 -m unittest discover -s software/tests -p 'test_phase48*population_execution_readiness_assurance.py' -v
      - name: Commit Phase 48 package
        run: |
          git config user.name "principia-phase-bot"
          git config user.email "actions@users.noreply.github.com"
          git add release/phase-48-* reports/phase-48-* scripts/generate_phase48_* scripts/validate_phase48_* software/tests/test_phase48_*
          git commit -m "Add Phase 48 population execution readiness assurance"
          git push
