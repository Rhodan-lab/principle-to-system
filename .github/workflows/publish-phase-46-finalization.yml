name: Publish Phase 46 finalization

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/publish_phase46_finalization.py"
      - ".github/workflows/publish-phase-46-finalization.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finalize-phase-46-population-readiness-assurance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish immutable Phase 46 finalization
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          if [ ! -f scripts/publish_phase46_finalization.py ]; then
            echo "Publisher already removed."
            exit 0
          fi
          python3 scripts/generate_phase46_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_decision_candidate_population_readiness_assurance.py --check
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/publish_phase46_finalization.py")
          text = path.read_text(encoding="utf-8")
          old = "    (\"python3\", 'scripts/generate_phase46_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_decision_candidate_population_readiness_assurance.py', \"--check\"),\n"
          if text.count(old) != 1:
              raise SystemExit("Phase 46 late deterministic-check marker drift")
          path.write_text(text.replace(old, "", 1), encoding="utf-8")
          PY
          python3 scripts/publish_phase46_finalization.py
