name: Apply Phase 10 Synthesis reconciliation

on:
  push:
    branches:
      - agent/phase-10-synthesis-reconciliation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-phase-10-synthesis
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 10 branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-10-synthesis-reconciliation
          fetch-depth: 0

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Normalize and compile Phase 10 scripts
        run: |
          python3 scripts/normalize_phase10_reconciler.py --write
          python3 -m py_compile scripts/normalize_phase10_reconciler.py
          python3 -m py_compile scripts/apply_phase10_synthesis.py
          python3 -m py_compile scripts/validate_phase10_synthesis.py

      - name: Apply coordinated synthesis reconciliation
        id: synthesis
        shell: bash
        run: |
          set +e
          python3 scripts/apply_phase10_synthesis.py --write > phase10-synthesis.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat phase10-synthesis.log
          exit 0

      - name: Upload Phase 10 reconciliation diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: phase10-synthesis-diagnostics
          path: phase10-synthesis.log

      - name: Stop on reconciliation errors
        if: steps.synthesis.outputs.status != '0'
        run: exit 1

      - name: Verify deterministic idempotence
        run: |
          python3 scripts/normalize_phase10_reconciler.py --check
          python3 scripts/apply_phase10_synthesis.py --check

      - name: Validate metadata and source foundation
        run: |
          python3 scripts/normalize_module_metadata.py
          python3 scripts/normalize_source_ledger.py --check --strict
          python3 scripts/apply_verified_source_baseline.py --check

      - name: Validate Foundations through Phase 9
        run: |
          python3 scripts/apply_foundations_review_sources.py --check
          python3 scripts/validate_foundations_continuity_phase9.py --allow-downstream-reviewed

      - name: Validate Physical Science
        run: |
          python3 scripts/apply_phase7_review_sources.py --check
          python3 scripts/finalize_phase7_review.py --check

      - name: Validate Life and Earth through Phase 9
        run: |
          python3 scripts/apply_phase8_review_sources.py --check
          python3 scripts/finalize_phase8_review.py --check
          python3 scripts/validate_phase8_continuity_phase9.py

      - name: Validate Technology through Phase 9
        run: |
          python3 scripts/normalize_phase9_transformer_literals.py --check
          python3 scripts/normalize_phase9_finalizer.py --check
          python3 scripts/apply_phase9_review_sources.py --check
          python3 scripts/finalize_phase9_review.py --check
          python3 scripts/validate_phase9_technology_review.py

      - name: Validate Phase 10 synthesis
        run: python3 scripts/validate_phase10_synthesis.py

      - name: Validate repository and applied materials
        run: |
          python3 scripts/validate_repo.py
          python3 scripts/validate_experiences.py --strict

      - name: Commit reconciled synthesis
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No Phase 10 changes remain.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'content: complete Phase 10 synthesis reconciliation'
          git push origin HEAD:agent/phase-10-synthesis-reconciliation
