name: Apply Phase 9 Technology review

on:
  push:
    branches:
      - agent/phase-9-technology-review
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-phase-9-technology
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 9 branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-9-technology-review
          fetch-depth: 0

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply reviewed source records
        run: python3 scripts/apply_phase9_review_sources.py --write

      - name: Apply coordinated twelve-file review
        id: transform
        shell: bash
        run: |
          set +e
          python3 scripts/apply_phase9_technology_review.py --write > phase9-transform.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat phase9-transform.log
          exit 0

      - name: Upload Phase 9 transformation diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: phase9-transform-diagnostics
          path: phase9-transform.log

      - name: Stop on transformation errors
        if: steps.transform.outputs.status != '0'
        run: exit 1

      - name: Verify source and content idempotence
        run: |
          python3 scripts/apply_phase9_review_sources.py --check
          python3 scripts/apply_phase9_technology_review.py --check

      - name: Validate Foundations continuity
        run: |
          python3 scripts/apply_foundations_review_sources.py --check
          python3 scripts/validate_foundations_continuity_phase9.py --allow-downstream-reviewed

      - name: Validate Physical Science continuity
        run: |
          python3 scripts/apply_phase7_review_sources.py --check
          python3 scripts/finalize_phase7_review.py --check

      - name: Validate Life and Earth continuity
        run: |
          python3 scripts/apply_phase8_review_sources.py --check
          python3 scripts/finalize_phase8_review.py --check
          python3 scripts/validate_phase8_continuity_phase9.py

      - name: Validate Phase 9 review contract
        run: python3 scripts/validate_phase9_technology_review.py

      - name: Validate repository structure
        run: python3 scripts/validate_repo.py

      - name: Commit reviewed files and audit records
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No Phase 9 changes remain.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'content: complete Phase 9 Technology review'
          git push origin HEAD:agent/phase-9-technology-review
