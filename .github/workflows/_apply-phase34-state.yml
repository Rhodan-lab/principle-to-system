name: Apply Phase 34 State Transition
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out finalization branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply exact Phase 34 state transition
        run: |
          sed -i 's/d3137bcaf84cb9f657e4f4c2c12e323d8434aa4a8d530a8f8a30e7ba6138339d/680af1e770263390eb88418833dd48543d29bf6620da166f892ed65e21544965/' scripts/_apply_phase34_project_state.py
          python3 scripts/_apply_phase34_project_state.py
      - name: Remove one-shot transition machinery
        run: |
          rm scripts/_apply_phase34_project_state.py
          rm .github/workflows/_apply-phase34-state.yml
      - name: Commit state transition to branch
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATE.md scripts/_apply_phase34_project_state.py .github/workflows/_apply-phase34-state.yml
          git commit -m "Finalize Phase 34 project state"
          git push origin "HEAD:${BRANCH}"
