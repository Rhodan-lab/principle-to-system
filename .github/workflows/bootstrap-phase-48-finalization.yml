name: Bootstrap Phase 48 finalization

on:
  push:
    branches:
      - agent/finalize-phase-48-population-execution-readiness-assurance
    paths:
      - .github/workflows/bootstrap-phase-48-finalization.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build finalization package
        shell: bash
        run: |
          cat > /tmp/finalizer.b64 <<'B64'
          
          B64
          base64 -d /tmp/finalizer.b64 | gzip -d > /tmp/finalize_phase48.py
          python3 /tmp/finalize_phase48.py
      - name: Commit non-workflow finalization files
        run: |
          git config user.name "principia-phase-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            PROJECT_STATE.md \
            release/phase-48-postmerge.json \
            reports/phase-48-offline-consequence-plan-review-response-intake-envelope-validation-execution-authorization-decision-candidate-population-execution-readiness-assurance.md \
            scripts/validate_phase42_postmerge_record.py \
            scripts/validate_phase43_postmerge_record.py \
            scripts/validate_phase44_postmerge_record.py \
            scripts/validate_phase45_postmerge_record.py \
            scripts/validate_phase46_postmerge_record.py \
            scripts/validate_phase47_postmerge_record.py \
            scripts/validate_phase48_postmerge_record.py
          git commit -m "Finalize Phase 48 assurance state"
          git push

# trigger: second-push
