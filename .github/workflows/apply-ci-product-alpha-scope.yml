name: Apply CI Product Alpha scope

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/apply_ci_product_alpha_scope.py'
      - 'ci/workflow-scope-policy.json'
      - 'software/tests/test_workflow_scope.py'
      - '.github/workflows/apply-ci-product-alpha-scope.yml'

permissions:
  contents: write

concurrency:
  group: apply-product-alpha-scope-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/product-alpha-ci-scope-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate legacy workflow exclusions
        run: python3 scripts/apply_ci_product_alpha_scope.py --write
      - name: Validate regenerated workflow tree
        run: |
          python3 -m py_compile scripts/apply_ci_product_alpha_scope.py
          python3 -m py_compile scripts/validate_workflow_scope.py
          python3 -m py_compile software/tests/test_workflow_scope.py
          python3 scripts/apply_ci_product_alpha_scope.py --check
          python3 scripts/validate_workflow_scope.py
          python3 -m unittest software.tests.test_workflow_scope -v
      - name: Commit generated workflow tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --exit-code && exit 0
          git commit -m 'Regenerate Product Alpha workflow scope'
          git push origin HEAD:${{ github.head_ref }}
