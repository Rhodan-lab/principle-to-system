name: Apply CI Product Alpha Scope

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-ci-product-alpha-scope.yml'
      - 'scripts/apply_ci_product_alpha_scope.py'
      - 'software/tests/test_workflow_scope.py'
  push:
    branches:
      - agent/ci-product-alpha-scope
    paths:
      - '.github/workflows/apply-ci-product-alpha-scope.yml'
      - 'scripts/apply_ci_product_alpha_scope.py'
      - 'software/tests/test_workflow_scope.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ci-product-alpha-scope
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate path-scoped workflows
        run: python3 scripts/apply_ci_product_alpha_scope.py --write
      - name: Verify generated policy
        run: |
          python3 scripts/apply_ci_product_alpha_scope.py --check
          python3 scripts/validate_workflow_scope.py
          python3 -m unittest software.tests.test_workflow_scope -v
      - name: Upload generated workflow tree
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-ci-product-alpha-scope
          path: .github/workflows
          include-hidden-files: true
      - name: Commit generated workflow updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows ci scripts/apply_ci_product_alpha_scope.py scripts/validate_workflow_scope.py software/tests/test_workflow_scope.py
          git commit -m "Scope legacy CI away from Product Alpha-only changes"
          git push origin HEAD:agent/ci-product-alpha-scope
