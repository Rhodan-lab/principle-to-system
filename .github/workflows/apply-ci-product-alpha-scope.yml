name: Export generated Product Alpha scope

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/apply_ci_product_alpha_scope.py'
      - 'ci/workflow-scope-policy.json'
      - 'software/tests/test_workflow_scope.py'
      - '.github/workflows/apply-ci-product-alpha-scope.yml'

permissions:
  contents: read

concurrency:
  group: export-product-alpha-scope-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  export:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/product-alpha-ci-scope-v2'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate permanent workflow tree
        run: python3 scripts/apply_ci_product_alpha_scope.py --write
      - name: Validate generated workflow tree
        run: |
          python3 scripts/apply_ci_product_alpha_scope.py --check
          python3 scripts/validate_workflow_scope.py
          python3 -m unittest software.tests.test_workflow_scope -v
      - name: Report and clean bytecode residue
        run: |
          find . -path './.git' -prune -o \( -type d -name __pycache__ -o -type f -name '*.py[co]' \) -print
          find . -type f -name '*.py[co]' -delete
          find . -type d -name __pycache__ -empty -delete
      - name: Upload generated workflow tree
        uses: actions/upload-artifact@v4
        with:
          name: product-alpha-scope-workflows
          path: .github/workflows
          if-no-files-found: error
          retention-days: 1
