name: Apply CI Product Alpha Scope

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-ci-product-alpha-scope.yml'
      - 'scripts/apply_ci_product_alpha_scope.py'
      - 'software/tests/test_workflow_scope.py'
  push:
    branches:
      - agent/ci-product-alpha-scope
    paths:
      - '.github/workflows/apply-ci-product-alpha-scope.yml'
      - 'scripts/apply_ci_product_alpha_scope.py'
      - 'software/tests/test_workflow_scope.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ci-product-alpha-scope
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate path-scoped workflows
        run: python3 scripts/apply_ci_product_alpha_scope.py --write
      - name: Verify generated policy
        run: |
          python3 scripts/apply_ci_product_alpha_scope.py --check
          python3 scripts/validate_workflow_scope.py
          python3 -m unittest software.tests.test_workflow_scope -v
      - name: Upload generated workflow tree
        uses: actions/upload-artifact@v4
        with:
          name: generated-ci-product-alpha-scope
          path: .github/workflows
          include-hidden-files: true
      - name: Create detached generated commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          repository = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          base_commit = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], text=True
          ).strip()
          api_root = f"https://api.github.com/repos/{repository}"

          def request(method, path, payload=None):
              data = None
              if payload is not None:
                  data = json.dumps(payload, separators=(',', ':')).encode('utf-8')
              req = urllib.request.Request(
                  api_root + path,
                  data=data,
                  method=method,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'principia-ci-scope-generator',
                  },
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          base = request('GET', f'/git/commits/{base_commit}')
          entries = []
          for workflow in sorted(Path('.github/workflows').glob('*.y*ml')):
              entries.append(
                  {
                      'path': workflow.as_posix(),
                      'mode': '100644',
                      'type': 'blob',
                      'content': workflow.read_text(encoding='utf-8'),
                  }
              )
          entries.append(
              {
                  'path': '.github/workflows/apply-ci-product-alpha-scope.yml',
                  'mode': '100644',
                  'type': 'blob',
                  'sha': None,
              }
          )
          tree = request(
              'POST',
              '/git/trees',
              {'base_tree': base['tree']['sha'], 'tree': entries},
          )
          commit = request(
              'POST',
              '/git/commits',
              {
                  'message': 'Scope legacy CI away from Product Alpha-only changes',
                  'tree': tree['sha'],
                  'parents': [base_commit],
              },
          )
          Path('detached-generated-commit.json').write_text(
              json.dumps(
                  {
                      'base_commit': base_commit,
                      'commit_sha': commit['sha'],
                      'tree_sha': tree['sha'],
                      'workflow_count': len(entries) - 1,
                  },
                  indent=2,
                  sort_keys=True,
              ) + '\n',
              encoding='utf-8',
          )
          print(f"Created detached commit {commit['sha']}")
          PY
      - name: Upload detached commit reference
        uses: actions/upload-artifact@v4
        with:
          name: detached-ci-product-alpha-scope-commit
          path: detached-generated-commit.json
