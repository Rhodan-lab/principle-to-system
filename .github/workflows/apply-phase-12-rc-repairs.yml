name: Apply Phase 12 RC Repairs

on:
  push:
    branches:
      - agent/phase-12-release-candidate
    paths:
      - 'scripts/apply_phase12_rc_repairs.py'
      - '.github/workflows/apply-phase-12-rc-repairs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-phase-12-rc-repairs
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 12 branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-12-release-candidate
          fetch-depth: 0

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply final RC repairs
        run: |
          python3 scripts/apply_phase12_rc_repairs.py --write
          python3 scripts/apply_phase12_rc_repairs.py --check
          python3 -m py_compile scripts/apply_phase12_rc_repairs.py
          python3 -m py_compile scripts/validate_phase12_release_candidate.py
          python3 scripts/validate_repo.py --strict
          python3 scripts/validate_phase12_release_candidate.py

      - name: Commit final RC repairs
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No RC repairs remain.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/validate_phase12_release_candidate.py foundations science technology
          git commit -m 'release: complete Phase 12 RC accessibility checks'
          git push origin HEAD:agent/phase-12-release-candidate
