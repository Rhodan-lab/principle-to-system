name: Validate Phase 35 Offline Consequence Plan Review Response Intake Envelope Validation Execution Authorization Readiness
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Principia Phase 35 evidence
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Phase 35 and inherited validators
        run: |
          python3 -m py_compile \
            scripts/generate_phase35_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_readiness.py \
            scripts/validate_phase35_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_readiness.py \
            scripts/validate_phase35_postmerge_record.py \
            scripts/validate_phase34_postmerge_record.py \
            scripts/generate_phase34_offline_consequence_plan_review_response_intake_envelope_validation_execution_readiness_assurance.py \
            scripts/validate_phase34_offline_consequence_plan_review_response_intake_envelope_validation_execution_readiness_assurance.py \
            scripts/validate_phase33_postmerge_record.py
      - name: Run complete Phase 35 chain
        run: |
          python3 scripts/generate_phase35_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_readiness.py --check
          python3 scripts/validate_phase35_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_readiness.py
          python3 scripts/validate_phase35_postmerge_record.py
          python3 -m unittest software.tests.test_phase35_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_readiness -v
          python3 scripts/validate_phase34_postmerge_record.py
          python3 scripts/generate_phase34_offline_consequence_plan_review_response_intake_envelope_validation_execution_readiness_assurance.py --check
          python3 scripts/validate_phase34_offline_consequence_plan_review_response_intake_envelope_validation_execution_readiness_assurance.py
          python3 -m unittest software.tests.test_phase34_offline_consequence_plan_review_response_intake_envelope_validation_execution_readiness_assurance -v
          python3 scripts/validate_phase33_postmerge_record.py
          python3 scripts/generate_phase33_offline_consequence_plan_review_response_intake_envelope_validation_execution_readiness.py --check
          python3 scripts/validate_phase33_offline_consequence_plan_review_response_intake_envelope_validation_execution_readiness.py
          python3 -m unittest software.tests.test_phase33_offline_consequence_plan_review_response_intake_envelope_validation_execution_readiness -v
          python3 -m unittest discover -s software/tests -v
          python3 scripts/validate_phase13_software.py
      - name: Upload complete Phase 35 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-35-authorization-readiness-diagnostics
          path: |
            release/phase-35-offline-consequence-plan-review-response-intake-envelope-validation-execution-authorization-readiness.json
            release/phase-35-postmerge.json
            reports/phase-35-offline-consequence-plan-review-response-intake-envelope-validation-execution-authorization-readiness.md
      - name: Verify permanent workflow immutability
        run: |
          git diff --exit-code
          git diff --cached --exit-code
