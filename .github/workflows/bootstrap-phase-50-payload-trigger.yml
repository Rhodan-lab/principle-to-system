name: Bootstrap Phase 50 payload trigger

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-phase-50-payload-trigger.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Extract validated Phase 50 payload
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          payload = ''.join(Path('.phase50-payload-corrected.b64').read_text(encoding='utf-8').split())
          Path('/tmp/phase50.tgz').write_bytes(base64.b64decode(payload))
          PY
          tar -xzf /tmp/phase50.tgz -C .
          python3 scripts/generate_phase50_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_decision_candidate_population_execution_authorization_readiness_assurance.py --check
          python3 scripts/validate_phase50_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_decision_candidate_population_execution_authorization_readiness_assurance.py
          python3 -m unittest discover -s software/tests -p 'test_phase50*authorization_readiness_assurance.py' -v
          python3 scripts/validate_phase49_postmerge_record.py
      - name: Commit Phase 50 payload
        run: |
          git config user.name "principia-phase-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f release/phase-50-* reports/phase-50-* scripts/generate_phase50_* scripts/validate_phase50_* software/tests/test_phase50_*
          git commit -m "Add Phase 50 population execution authorization readiness assurance"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

# synchronize: 2
