name: Validate Unified Principia Atlas Website

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "software/one_website/**"
      - "software/principia_atlas/suite.py"
      - "software/tests/test_one_website.py"
      - "software/tests/test_one_website_math.mjs"
      - "software/tests/test_one_website_atlas_ui.mjs"
      - "software/tests/test_one_website_universe.mjs"
      - "software/tests/test_one_website_explorations.mjs"
      - "vercel.json"
      - ".github/workflows/validate-one-website.yml"
  push:
    paths:
      - "software/one_website/**"
      - "software/principia_atlas/suite.py"
      - "software/tests/test_one_website.py"
      - "software/tests/test_one_website_math.mjs"
      - "software/tests/test_one_website_atlas_ui.mjs"
      - "software/tests/test_one_website_universe.mjs"
      - "software/tests/test_one_website_explorations.mjs"
      - "vercel.json"
      - ".github/workflows/validate-one-website.yml"
permissions:
  contents: read

jobs:
  static-web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out Principia
        uses: actions/checkout@v4
        with:
          path: principle-to-system
          persist-credentials: false
      - name: Check out exact Atlas source
        uses: actions/checkout@v4
        with:
          repository: Rhodan-lab/Atlas
          ref: 750933883996cc0759cfa40931db6cd262b13b07
          path: Atlas
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Atlas canonical parser dependency
        working-directory: principle-to-system
        run: python3 -m pip install --disable-pip-version-check -r ../Atlas/tools/foundation-validator/requirements.txt
      - name: Validate exact source pins
        working-directory: principle-to-system
        run: |
          test "$(tr -d '\r\n' < software/one_website/atlas-commit.txt)" = "$(git -C ../Atlas rev-parse HEAD)"
      - name: Unit-test static website contracts
        working-directory: principle-to-system
        run: python3 -m unittest discover -s software/tests -p 'test_one_website.py' -v
      - name: Validate accessible mathematics and interactive preview
        working-directory: principle-to-system
        run: |
          node --check software/one_website/site.js
          node --check software/one_website/experience.js
          node --check software/one_website/atlas-workspace.js
          node --check software/one_website/universe.js
          node --check software/one_website/exploration-models.js
          node --check software/one_website/exploration.js
          node --test software/tests/test_one_website_math.mjs
          node --test software/tests/test_one_website_atlas_ui.mjs
          node --test software/tests/test_one_website_universe.mjs
          node --test software/tests/test_one_website_explorations.mjs
      - name: Build unified static website
        working-directory: principle-to-system
        run: python3 software/one_website/build.py build --atlas-repo ../Atlas --output dist
      - name: Verify immutable static assets
        working-directory: principle-to-system
        run: python3 software/one_website/build.py verify --output dist
      - name: Ensure four laboratories and research were packaged
        working-directory: principle-to-system
        run: |
          test -f dist/learn/refrigerator/data/refrigerator.json
          test -f dist/learn/distributed-information/data/distributed-information.json
          test -f dist/research/data/workspace-shell-data.json
          test -f dist/atlas-workspace.css
          test -f dist/atlas-workspace.js
          test -f dist/universe.css
          test -f dist/universe.js
          test -f dist/explore/index.html
          test -f dist/explore/rainwater/index.html
          test -f dist/explore/microgrid/index.html
          test -f dist/exploration-models.js
          test -f dist/exploration.js
          test -f dist/exploration.css
          test ! -e dist/learn/refrigerator/facilitator.html
          test ! -e dist/learn/refrigerator/pilot-lab.html
      - name: Smoke-test all routes through a real local HTTP server
        working-directory: principle-to-system
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist >/tmp/principia-site-smoke.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for path in / /universe.css /universe.js /site.js /explore/ /explore/rainwater/ /explore/microgrid/ /exploration.js /exploration-models.js /exploration.css /research/ /research/app.js /research/data/workspace-export.json /learn/refrigerator/ /learn/refrigerator/data/refrigerator.json /learn/distributed-information/ /learn/distributed-information/data/distributed-information.json; do
            curl --fail --silent --show-error --retry 8 --retry-delay 1 --retry-connrefused "http://127.0.0.1:8765$path" > /dev/null
          done
      - name: Upload preview site artifact
        uses: actions/upload-artifact@v4
        with:
          name: principia-atlas-static-site
          path: principle-to-system/dist/
          if-no-files-found: error
          retention-days: 7
