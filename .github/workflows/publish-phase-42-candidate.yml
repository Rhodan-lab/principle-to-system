name: Publish Phase 42 Candidate
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 42 branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-42-offline-consequence-plan-review-response-intake-envelope-validation-execution-authorization-decision-candidate-preparation-readiness-assurance
          fetch-depth: 0
      - name: Reconstruct and validate Phase 42 package
        run: |
          echo '38037ef9cd9cf7ea2b09757da7acb1ace4dbb944b77665ee16feff3773ed7c68  phase42-package.part00' | sha256sum -c -
          echo '975a5803073ebaac08047618cede2a5407c7f4a215eee020335646c11dd1a446  phase42-package.part01' | sha256sum -c -
          echo 'd0778e54e05db5a86e1a67cabaaa26d2ef7fe9e980423b0924c3040334794475  phase42-package.part02' | sha256sum -c -
          echo '18cecae3bc98a599c9424449127ed6e759366995e137a80c0bca31f95416ef87  phase42-package.part03' | sha256sum -c -
          cat phase42-package.part00 phase42-package.part01 phase42-package.part02 phase42-package.part03 > /tmp/phase42-package.b64
          echo '33e361cc908664e98d1a408732a38a7359b9129bde836736329524891dab7d91  /tmp/phase42-package.b64' | sha256sum -c -
          base64 -d /tmp/phase42-package.b64 > /tmp/phase42-package.tgz
          echo '1ea1292a1ec975227fe05e242277853961cc88b27467b04f26a8ae3e1f8d0ee9  /tmp/phase42-package.tgz' | sha256sum -c -
          tar -xzf /tmp/phase42-package.tgz
          python3 scripts/generate_phase42_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_decision_candidate_preparation_readiness_assurance.py --check
          echo '6fb602bc5ef863765ceb50ba66124b843381fd15c6dac9da9250429e18e76f26  release/phase-42-offline-consequence-plan-review-response-intake-envelope-validation-execution-authorization-decision-candidate-preparation-readiness-assurance.json' | sha256sum -c -
          python3 scripts/validate_phase42_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_decision_candidate_preparation_readiness_assurance.py
          python3 -m unittest software.tests.test_phase42_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_decision_candidate_preparation_readiness_assurance -v
      - name: Commit five non-workflow evidence files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/generate_phase42_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_decision_candidate_preparation_readiness_assurance.py
          git add scripts/validate_phase42_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_decision_candidate_preparation_readiness_assurance.py
          git add software/tests/test_phase42_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_decision_candidate_preparation_readiness_assurance.py
          git add reports/phase-42-offline-consequence-plan-review-response-intake-envelope-validation-execution-authorization-decision-candidate-preparation-readiness-assurance.md
          git add release/phase-42-offline-consequence-plan-review-response-intake-envelope-validation-execution-authorization-decision-candidate-preparation-readiness-assurance.json
          git commit -m 'Add Phase 42 candidate-preparation readiness assurance evidence'
          git push origin HEAD:agent/phase-42-offline-consequence-plan-review-response-intake-envelope-validation-execution-authorization-decision-candidate-preparation-readiness-assurance