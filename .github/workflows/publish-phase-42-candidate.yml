name: Remove Temporary Phase 42 Publisher
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 42 branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-42-offline-consequence-plan-review-response-intake-envelope-validation-execution-authorization-decision-candidate-preparation-readiness-assurance
          fetch-depth: 0
      - name: Remove temporary transport and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f phase42-package.b64 phase42-package.part00 phase42-package.part01 phase42-package.part02 phase42-package.part03
          rm -f .github/workflows/publish-phase-42-candidate.yml
          git add -u
          git commit -m 'Remove Phase 42 temporary publication files'
          git push origin HEAD:agent/phase-42-offline-consequence-plan-review-response-intake-envelope-validation-execution-authorization-decision-candidate-preparation-readiness-assurance