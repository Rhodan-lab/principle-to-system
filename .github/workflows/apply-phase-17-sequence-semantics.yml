name: Apply Phase 17 Sequence Semantics

on:
  push:
    branches:
      - agent/phase-17-offline-event-protocol-candidate
    paths:
      - '.github/workflows/apply-phase-17-sequence-semantics.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-phase-17-sequence-semantics
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-17-offline-event-protocol-candidate
          fetch-depth: 0

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply stale-sequence classification and regenerate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/generate_phase17_offline_event_protocol.py')
          text = path.read_text(encoding='utf-8')
          old = 'if not isinstance(sequence, int) or isinstance(sequence, bool) or sequence < 1:'
          new = 'if not isinstance(sequence, int) or isinstance(sequence, bool) or sequence < 0:'
          if new not in text:
              if old not in text:
                  raise SystemExit('Phase 17 sequence validation anchor is missing')
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
          python3 scripts/generate_phase17_offline_event_protocol.py --write
          python3 scripts/generate_phase17_offline_event_protocol.py --check
          python3 -m unittest software.tests.test_phase17_offline_event_protocol -v

      - name: Commit deterministic semantic correction
        shell: bash
        run: |
          targets=(
            scripts/generate_phase17_offline_event_protocol.py
            integration/principia-atlas/pilot/thermal-control.event-recovery-matrix.v03.json
          )
          if git diff --quiet -- "${targets[@]}"; then
            echo 'Phase 17 sequence semantics already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${targets[@]}"
          git commit -m 'fix: classify Phase 17 stale event sequences'
          git push origin HEAD:agent/phase-17-offline-event-protocol-candidate
