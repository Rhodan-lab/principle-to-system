name: Phase 5 source repair

on:
  push:
    branches:
      - agent/phase-5-source-repair
    paths:
      - 'scripts/normalize_source_ledger.py'
      - 'scripts/apply_verified_source_baseline.py'
      - 'sources/source-ledger.md'
      - 'sources/verified-source-baseline.json'
      - 'reports/phase-5-source-audit.json'
      - 'reports/phase-5-source-replacements.json'
      - '.github/workflows/phase-5-source-repair.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/normalize_source_ledger.py'
      - 'scripts/apply_verified_source_baseline.py'
      - 'sources/source-ledger.md'
      - 'sources/verified-source-baseline.json'
      - 'reports/phase-5-source-audit.json'
      - 'reports/phase-5-source-replacements.json'
      - '.github/workflows/phase-5-source-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase-5-source-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  normalize:
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source-repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-5-source-repair
          fetch-depth: 0

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Recover and normalize legacy rows
        run: python3 scripts/normalize_source_ledger.py --write

      - name: Apply inspected source replacements
        run: python3 scripts/apply_verified_source_baseline.py --write

      - name: Regenerate final source-quality audit
        continue-on-error: true
        run: python3 scripts/normalize_source_ledger.py --write --strict

      - name: Verify replacement idempotence
        run: python3 scripts/apply_verified_source_baseline.py --check

      - name: Commit repaired ledger and reports
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No source-ledger changes remain.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources/source-ledger.md reports/phase-5-source-audit.json reports/phase-5-source-replacements.json
          git commit -m 'chore: apply verified source baseline'
          git push origin HEAD:agent/phase-5-source-repair

  verify:
    if: github.event_name == 'pull_request' || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out committed result
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify normalized source structure and coverage
        run: python3 scripts/normalize_source_ledger.py --check --strict

      - name: Verify inspected replacements are applied
        run: python3 scripts/apply_verified_source_baseline.py --check
