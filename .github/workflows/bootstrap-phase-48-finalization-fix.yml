name: Bootstrap Phase 48 finalization fix

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-phase-48-finalization-fix.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild and validate finalization
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip, re
          from pathlib import Path
          workflow = Path('.github/workflows/bootstrap-phase-48-finalization-pr.yml').read_text(encoding='utf-8')
          match = re.search(r"cat > /tmp/finalizer\.b64 <<'B64'\n\s*([A-Za-z0-9+/=\n ]+?)\n\s*B64", workflow)
          if not match:
              raise SystemExit('finalizer payload not found')
          payload = ''.join(match.group(1).split())
          Path('/tmp/finalize_phase48.py').write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
          python3 /tmp/finalize_phase48.py || true
          python3 - <<'PY'
          import re
          from pathlib import Path
          next_gate = 'offline-consequence-plan-review-response-intake-envelope-validation-execution-authorization-decision-candidate-population-execution-authorization-readiness-candidate'
          for phase in range(42, 46):
              path = Path(f'scripts/validate_phase{phase}_postmerge_record.py')
              text = path.read_text(encoding='utf-8')
              text = re.sub(r"^CURRENT_NEXT\s*=\s*['\"].*['\"]$", f"CURRENT_NEXT = '{next_gate}'", text, flags=re.M)
              text = text.replace('current Phase 48 population-execution-readiness-assurance gate missing', 'current Phase 49 population-execution-authorization-readiness gate missing')
              path.write_text(text, encoding='utf-8')
          PY
          python3 scripts/validate_phase48_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_decision_candidate_population_execution_readiness_assurance.py
          for phase in 48 47 46 45 44 43 42; do python3 scripts/validate_phase${phase}_postmerge_record.py; done
      - name: Commit finalization
        shell: bash
        run: |
          git config user.name "principia-phase-bot"
          git config user.email "actions@users.noreply.github.com"
          git add PROJECT_STATE.md release/phase-48-postmerge.json scripts/validate_phase42_postmerge_record.py scripts/validate_phase43_postmerge_record.py scripts/validate_phase44_postmerge_record.py scripts/validate_phase45_postmerge_record.py scripts/validate_phase46_postmerge_record.py scripts/validate_phase47_postmerge_record.py scripts/validate_phase48_postmerge_record.py
          git add -f .github/workflows/validate-phase-48-offline-consequence-plan-review-response-intake-envelope-validation-execution-authorization-decision-candidate-population-execution-readiness-assurance.yml
          git commit -m "Finalize Phase 48 assurance state"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

# synchronize: 1
