name: Validate Phase 42 Offline Authorization Decision Candidate Preparation Readiness Assurance
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'software/product_alpha/**'
      - 'software/tests/test_product_alpha*.py'
      - 'software/tests/test_product_alpha*.mjs'
      - '.github/workflows/validate-product-alpha.yml'
  push:
    branches: [main]
    paths-ignore:
      - 'software/product_alpha/**'
      - 'software/tests/test_product_alpha*.py'
      - 'software/tests/test_product_alpha*.mjs'
      - '.github/workflows/validate-product-alpha.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Principia Phase 42 evidence
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Phase 42 and inherited validators
        run: |
          python3 -m py_compile \
            scripts/generate_phase42_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_decision_candidate_preparation_readiness_assurance.py \
            scripts/validate_phase42_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_decision_candidate_preparation_readiness_assurance.py \
            scripts/validate_phase42_postmerge_record.py \
            scripts/validate_phase41_postmerge_record.py \
            scripts/generate_phase41_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_decision_candidate_preparation_readiness.py \
            scripts/validate_phase41_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_decision_candidate_preparation_readiness.py \
            scripts/validate_phase40_postmerge_record.py
      - name: Run complete Phase 42 chain
        run: |
          python3 scripts/generate_phase42_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_decision_candidate_preparation_readiness_assurance.py --check
          python3 scripts/validate_phase42_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_decision_candidate_preparation_readiness_assurance.py
          python3 scripts/validate_phase42_postmerge_record.py
          python3 -m unittest software.tests.test_phase42_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_decision_candidate_preparation_readiness_assurance -v
          python3 scripts/validate_phase41_postmerge_record.py
          python3 scripts/generate_phase41_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_decision_candidate_preparation_readiness.py --check
          python3 scripts/validate_phase41_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_decision_candidate_preparation_readiness.py
          python3 -m unittest software.tests.test_phase41_offline_consequence_plan_review_response_intake_envelope_validation_execution_authorization_decision_candidate_preparation_readiness -v
          python3 scripts/validate_phase40_postmerge_record.py
          python3 -m unittest discover -s software/tests -v
          python3 scripts/validate_phase13_software.py
      - name: Upload Phase 42 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-42-authorization-decision-candidate-preparation-readiness-assurance-diagnostics
          path: |
            release/phase-42-offline-consequence-plan-review-response-intake-envelope-validation-execution-authorization-decision-candidate-preparation-readiness-assurance.json
            release/phase-42-postmerge.json
            reports/phase-42-offline-consequence-plan-review-response-intake-envelope-validation-execution-authorization-decision-candidate-preparation-readiness-assurance.md
      - name: Verify permanent workflow immutability
        run: |
          git diff --exit-code -- . ':(exclude)**/__pycache__/**' ':(exclude)**/*.pyc'
          git diff --cached --exit-code -- . ':(exclude)**/__pycache__/**' ':(exclude)**/*.pyc'
          test -z "$(git status --porcelain --untracked-files=all | grep -Ev '(__pycache__/|\.pyc$)' || true)"
