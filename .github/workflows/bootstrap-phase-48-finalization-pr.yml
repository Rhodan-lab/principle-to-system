name: Bootstrap Phase 48 finalization PR

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-phase-48-finalization-pr.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and validate finalization package
        shell: bash
        run: |
          cat > /tmp/finalizer.b64 <<'B64'
          
          B64
          base64 -d /tmp/finalizer.b64 | gzip -d > /tmp/finalize_phase48.py
          python3 /tmp/finalize_phase48.py
      - name: Commit finalization files
        run: |
          git config user.name "principia-phase-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            PROJECT_STATE.md \
            release/phase-48-postmerge.json \
            scripts/validate_phase42_postmerge_record.py \
            scripts/validate_phase43_postmerge_record.py \
            scripts/validate_phase44_postmerge_record.py \
            scripts/validate_phase45_postmerge_record.py \
            scripts/validate_phase46_postmerge_record.py \
            scripts/validate_phase47_postmerge_record.py \
            scripts/validate_phase48_postmerge_record.py \
            .github/workflows/validate-phase-48-offline-consequence-plan-review-response-intake-envelope-validation-execution-authorization-decision-candidate-population-execution-readiness-assurance.yml
          git commit -m "Finalize Phase 48 assurance state"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

# synchronize: 2
