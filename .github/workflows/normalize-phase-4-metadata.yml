name: Normalize Phase 4 metadata

on:
  push:
    branches:
      - agent/phase-4-metadata-normalization
    paths:
      - 'scripts/normalize_module_metadata.py'
      - 'foundations/**'
      - 'science/**'
      - 'technology/**'
      - '.github/workflows/normalize-phase-4-metadata.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-4-metadata-normalization
          fetch-depth: 0

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Normalize all 60 learner files
        run: python3 scripts/normalize_module_metadata.py --write

      - name: Run core structural validator
        run: python3 scripts/validate_repo.py

      - name: Commit generated metadata repairs
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No metadata changes remain.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add foundations science technology reports/phase-4-metadata-normalization.json
          git commit -m 'chore: normalize module metadata [skip ci]'
          git push origin HEAD:agent/phase-4-metadata-normalization
