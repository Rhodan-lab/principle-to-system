name: Apply Phase 17 State

on:
  push:
    branches:
      - agent/phase-17-offline-event-protocol-candidate
    paths:
      - 'scripts/finalize_phase17_state.py'
      - '.github/workflows/apply-phase-17-state.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-phase-17-state
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-17-offline-event-protocol-candidate
          fetch-depth: 0

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply deterministic state transition
        run: |
          python3 scripts/finalize_phase17_state.py --write
          python3 scripts/finalize_phase17_state.py --check

      - name: Commit state transition
        shell: bash
        run: |
          if git diff --quiet -- PROJECT_STATE.md; then
            echo 'Phase 17 state already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_STATE.md
          git commit -m 'docs: activate Phase 17 offline event protocol'
          git push origin HEAD:agent/phase-17-offline-event-protocol-candidate
