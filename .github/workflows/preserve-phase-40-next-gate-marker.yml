name: Preserve Phase 40 Historical Next Gate

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/preserve-phase-40-next-gate-marker.yml

permissions:
  contents: write

jobs:
  preserve:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finalize-phase-41-candidate-preparation-readiness
      - name: Preserve inherited validator marker
        run: python3 .phase41-fix/preserve_phase40_next_gate.py
      - name: Remove temporary controls
        run: |
          rm -rf .phase41-fix
          rm .github/workflows/preserve-phase-40-next-gate-marker.yml
      - name: Commit historical marker
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Preserve Phase 40 historical next gate'
          git push origin HEAD:agent/finalize-phase-41-candidate-preparation-readiness
