name: Validate Phase 33 Offline Consequence Plan Review Response Intake Envelope Validation Execution Readiness

on:
  pull_request:
    paths-ignore:
      - 'software/product_alpha/**'
      - 'software/tests/test_product_alpha*.py'
      - 'software/tests/test_product_alpha*.mjs'
      - '.github/workflows/validate-product-alpha.yml'
  push:
    branches: [main]
    paths-ignore:
      - 'software/product_alpha/**'
      - 'software/tests/test_product_alpha*.py'

      - 'software/tests/test_product_alpha*.mjs'
      - '.github/workflows/validate-product-alpha.yml'
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Principia Phase 33 evidence
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Phase 33 and inherited validators
        run: |
          python3 -m py_compile \
            scripts/generate_phase33_offline_consequence_plan_review_response_intake_envelope_validation_execution_readiness.py \
            scripts/validate_phase33_offline_consequence_plan_review_response_intake_envelope_validation_execution_readiness.py \
            scripts/generate_phase32_offline_consequence_plan_review_response_intake_envelope_validation_readiness_assurance.py \
            scripts/validate_phase32_offline_consequence_plan_review_response_intake_envelope_validation_readiness_assurance.py \
            scripts/validate_phase32_postmerge_record.py
          if [ -f scripts/validate_phase33_postmerge_record.py ]; then
            python3 -m py_compile scripts/validate_phase33_postmerge_record.py
          fi
      - name: Run complete Phase 33 chain
        run: |
          set -o pipefail
          {
            python3 scripts/generate_phase33_offline_consequence_plan_review_response_intake_envelope_validation_execution_readiness.py --check
            python3 scripts/validate_phase33_offline_consequence_plan_review_response_intake_envelope_validation_execution_readiness.py
            if [ -f scripts/validate_phase33_postmerge_record.py ]; then
              python3 scripts/validate_phase33_postmerge_record.py
            fi
            python3 -m unittest software.tests.test_phase33_offline_consequence_plan_review_response_intake_envelope_validation_execution_readiness -v
            python3 scripts/generate_phase32_offline_consequence_plan_review_response_intake_envelope_validation_readiness_assurance.py --check
            python3 scripts/validate_phase32_offline_consequence_plan_review_response_intake_envelope_validation_readiness_assurance.py
            python3 scripts/validate_phase32_postmerge_record.py
            python3 -m unittest software.tests.test_phase32_offline_consequence_plan_review_response_intake_envelope_validation_readiness_assurance -v
            python3 scripts/generate_phase31_offline_consequence_plan_review_response_intake_envelope_validation_readiness.py --check
            python3 scripts/validate_phase31_offline_consequence_plan_review_response_intake_envelope_validation_readiness.py
            python3 scripts/validate_phase31_postmerge_record.py
            python3 -m unittest software.tests.test_phase31_offline_consequence_plan_review_response_intake_envelope_validation_readiness -v
            python3 scripts/validate_principia_atlas_bridge.py
            python3 scripts/validate_principia_atlas_audit.py
            python3 scripts/validate_repo.py --strict
            python3 -m unittest discover -s software/tests -v
          } 2>&1 | tee phase33-validation.log
      - name: Upload complete Phase 33 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase33-validation
          path: phase33-validation.log
      - name: Verify permanent workflow immutability
        run: |
          test -z "$(git diff --name-only)"
          test -z "$(git diff --cached --name-only)"
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path(".github/workflows/validate-phase-33-offline-consequence-plan-review-response-intake-envelope-validation-execution-readiness.yml").read_text()
          forbidden = (
              "contents" + ": write",
              "git " + "push",
              "git " + "commit",
              "pull_request" + "_target",
              "repository: Rhodan-lab/" + "Atlas",
              "cu" + "rl ",
              "wg" + "et ",
          )
          assert "contents: read" in workflow
          for token in forbidden:
              assert token not in workflow, token
          PY
