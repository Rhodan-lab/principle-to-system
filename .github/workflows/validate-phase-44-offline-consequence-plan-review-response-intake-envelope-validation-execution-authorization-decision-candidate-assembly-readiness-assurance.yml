name: Validate Phase 44 assurance

on:
  pull_request:
    paths-ignore:
      - 'software/product_alpha/**'
      - 'software/tests/test_product_alpha*.py'
  push:
    paths-ignore:
      - 'software/product_alpha/**'
      - 'software/tests/test_product_alpha*.py'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile validators
        run: python3 -m py_compile scripts/*phase44*assurance.py scripts/validate_phase44_postmerge_record.py scripts/validate_phase43_postmerge_record.py
      - name: Check deterministic bytes
        run: python3 scripts/generate_phase44_*_assurance.py --check
      - name: Validate candidate
        run: python3 scripts/validate_phase44_*_assurance.py
      - name: Validate post-merge record
        run: python3 scripts/validate_phase44_postmerge_record.py
      - name: Run mutation tests
        run: python3 -m unittest discover -s software/tests -p 'test_phase44*assurance.py' -v
      - name: Revalidate Phase 43
        run: python3 scripts/validate_phase43_postmerge_record.py
      - name: Verify clean checkout
        run: |
          git diff --exit-code -- . ':(exclude)**/__pycache__/**' ':(exclude)**/*.pyc'
          git diff --cached --exit-code -- . ':(exclude)**/__pycache__/**' ':(exclude)**/*.pyc'
          test -z "$(git status --porcelain --untracked-files=all | grep -Ev '(__pycache__/|\.pyc$)' || true)"
