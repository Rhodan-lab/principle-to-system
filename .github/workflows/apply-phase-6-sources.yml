name: Apply Phase 6 reviewed sources

on:
  push:
    branches:
      - agent/phase-6-foundations-review
    paths:
      - 'sources/foundations-review-sources.json'
      - 'scripts/apply_foundations_review_sources.py'
      - '.github/workflows/apply-phase-6-sources.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-phase-6-sources
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-6-foundations-review
          fetch-depth: 0

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply reviewed source records
        run: python3 scripts/apply_foundations_review_sources.py --write

      - name: Verify deterministic result
        run: python3 scripts/apply_foundations_review_sources.py --check

      - name: Commit source ledger and report
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No Phase 6 source changes remain.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources/source-ledger.md reports/phase-6-foundations-sources.json
          git commit -m 'chore: add reviewed Foundations sources'
          git push origin HEAD:agent/phase-6-foundations-review
