name: Finalize Phase 41 Project State

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/finalize-phase-41-project-state.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finalize-phase-41-candidate-preparation-readiness
      - name: Promote Phase 41 durable state
        run: python3 .phase41-finalize/finalize_project_state.py
      - name: Remove temporary transition controls
        run: |
          rm -rf .phase41-finalize
          rm .github/workflows/finalize-phase-41-project-state.yml
      - name: Commit durable Phase 41 state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize Phase 41 project state'
          git push origin HEAD:agent/finalize-phase-41-candidate-preparation-readiness
