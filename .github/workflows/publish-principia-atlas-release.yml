name: Publish Principia Atlas Release

on:
  push:
    tags:
      - "principia-atlas-v*"

permissions:
  contents: write

concurrency:
  group: principia-atlas-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  ATLAS_COMMIT: 750933883996cc0759cfa40931db6cd262b13b07

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out tagged Principia source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate immutable tag boundary
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#principia-atlas-v}"
          test "$tag" != "$version"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub Release already exists for $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check out pinned Atlas product input
        uses: actions/checkout@v4
        with:
          repository: Rhodan-lab/Atlas
          ref: ${{ env.ATLAS_COMMIT }}
          path: atlas
          persist-credentials: false

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: atlas/tools/foundation-validator/requirements.txt

      - name: Install pinned Atlas dependencies
        run: python3 -m pip install -r atlas/tools/foundation-validator/requirements.txt

      - name: Isolate Atlas from the Principia worktree
        run: mv atlas "$RUNNER_TEMP/atlas"

      - name: Compile release promotion stack
        run: |
          python3 -m py_compile software/principia_atlas/suite.py
          python3 -m py_compile software/principia_atlas/orchestrate.py
          python3 -m py_compile software/principia_atlas/release.py
          python3 -m py_compile software/principia_atlas/release_runtime.py
          python3 -m py_compile software/principia_atlas/promotion_policy.py
          python3 -m py_compile software/principia_atlas/promotion.py

      - name: Build exact tagged release
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          python3 software/principia_atlas/release.py build \
            --atlas-repo "$RUNNER_TEMP/atlas" \
            --route distributed-information \
            --version "$VERSION" \
            --expected-principia-commit "$GITHUB_SHA" \
            --expected-atlas-commit "$ATLAS_COMMIT" \
            --output "$RUNNER_TEMP/principia-atlas-$VERSION.zip"

      - name: Load immutable promotion history
        env:
          CURRENT_TAG: ${{ steps.identity.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          history="$RUNNER_TEMP/promotion-history"
          mkdir -p "$history"
          git tag -l 'principia-atlas-v*' | grep -vxF "$CURRENT_TAG" > "$RUNNER_TEMP/expected-release-tags.txt" || true
          gh release list \
            --limit 1000 \
            --json tagName,isDraft \
            --jq '.[] | select(.isDraft == false and (.tagName | startswith("principia-atlas-v"))) | .tagName' \
            > "$RUNNER_TEMP/published-release-tags.txt"
          while IFS= read -r historical_tag; do
            test -n "$historical_tag" || continue
            destination="$history/$historical_tag"
            mkdir -p "$destination"
            gh release download "$historical_tag" \
              --pattern principia-atlas-promotion.json \
              --dir "$destination"
          done < "$RUNNER_TEMP/published-release-tags.txt"

      - name: Prepare and verify promotion candidate
        env:
          TAG: ${{ steps.identity.outputs.tag }}
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          archive="$RUNNER_TEMP/principia-atlas-$VERSION.zip"
          output="$RUNNER_TEMP/promotion"
          python3 software/principia_atlas/promotion.py prepare \
            --archive "$archive" \
            --tag "$TAG" \
            --history-dir "$RUNNER_TEMP/promotion-history" \
            --expected-tags "$RUNNER_TEMP/expected-release-tags.txt" \
            --output-dir "$output"
          python3 software/principia_atlas/promotion.py verify \
            --archive "$archive" \
            --promotion "$output/principia-atlas-promotion.json" \
            --index "$output/principia-atlas-release-index.json"

      - name: Publish immutable GitHub Release
        env:
          TAG: ${{ steps.identity.outputs.tag }}
          VERSION: ${{ steps.identity.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/principia-atlas-$VERSION.zip"
          promotion="$RUNNER_TEMP/promotion"
          channel=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["channel"])' "$promotion/principia-atlas-promotion.json")
          flags=()
          if [ "$channel" = stable ]; then
            flags+=(--latest)
          else
            flags+=(--prerelease)
          fi
          gh release create "$TAG" \
            "$archive" \
            "$archive.sha256" \
            "$promotion/principia-atlas-promotion.json" \
            "$promotion/principia-atlas-release-index.json" \
            --title "Principia & Atlas $VERSION" \
            --notes-file "$promotion/RELEASE-NOTES.md" \
            "${flags[@]}"

      - name: Verify published release assets
        env:
          TAG: ${{ steps.identity.outputs.tag }}
        run: |
          gh release view "$TAG" \
            --json tagName,isDraft,isPrerelease,assets \
            --jq '{tagName,isDraft,isPrerelease,assets:[.assets[].name]}'

      - name: Verify source checkout immutability
        run: |
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test -z "$(git -C "$RUNNER_TEMP/atlas" status --porcelain=v1 --untracked-files=all)"
