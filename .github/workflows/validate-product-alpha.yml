name: Validate Product Alpha

on:
  pull_request:
    paths:
      - "PRODUCT_STATE.md"
      - "README.md"
      - "experiences/phase-11b-inventory.json"
      - "reports/product-alpha-0-*.md"
      - "reports/product-alpha-0-*.json"
      - "reports/principia-atlas-*.md"
      - "software/product_alpha/**"
      - "software/principia_atlas/**"
      - "software/tests/test_product_alpha*.py"
      - "software/tests/test_product_alpha*.mjs"
      - "system-dossiers/refrigerator.md"
      - "failure-atlas/feedback-instability.md"
      - "investigations/room-cooling.md"
      - "design-challenges/passive-cooler.md"
      - "system-dossiers/web-service-request.md"
      - "failure-atlas/retry-storm-queue-collapse.md"
      - "investigations/queue-delay-near-capacity.md"
      - "design-challenges/resilient-school-information-service.md"
      - ".github/workflows/validate-product-alpha.yml"
  push:
    paths:
      - "PRODUCT_STATE.md"
      - "README.md"
      - "experiences/phase-11b-inventory.json"
      - "reports/product-alpha-0-*.md"
      - "reports/product-alpha-0-*.json"
      - "reports/principia-atlas-*.md"
      - "software/product_alpha/**"
      - "software/principia_atlas/**"
      - "software/tests/test_product_alpha*.py"
      - "software/tests/test_product_alpha*.mjs"
      - "system-dossiers/refrigerator.md"
      - "failure-atlas/feedback-instability.md"
      - "investigations/room-cooling.md"
      - "design-challenges/passive-cooler.md"
      - "system-dossiers/web-service-request.md"
      - "failure-atlas/retry-storm-queue-collapse.md"
      - "investigations/queue-delay-near-capacity.md"
      - "design-challenges/resilient-school-information-service.md"
      - ".github/workflows/validate-product-alpha.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Product Alpha
        run: |
          python3 -m py_compile \
            software/product_alpha/route_identity.py \
            software/product_alpha/build.py \
            software/product_alpha/run_pilot.py \
            software/product_alpha/prepare_pilot.py \
            software/product_alpha/launch_workspace.py \
            software/principia_atlas/suite.py \
            software/product_alpha/evaluation/summarize.py \
            software/product_alpha/evaluation/prepare_workspace.py \
            software/product_alpha/evaluation/assemble_workspace.py \
            software/product_alpha/evaluation/review_workspace.py \
            software/product_alpha/evaluation/record_decision.py \
            software/product_alpha/evaluation/workspace_status.py \
            software/product_alpha/evaluation/prepare_handoff.py \
            software/product_alpha/evaluation/verify_cohort.py \
            software/product_alpha/evaluation/prepare_review.py \
            software/product_alpha/evaluation/validate_internal_review.py \
            software/product_alpha/evaluation/validate_route_selection.py
      - name: Verify Product Alpha JSON
        run: |
          python3 -m json.tool software/product_alpha/evaluation/rubric.json >/dev/null
          python3 -m json.tool software/product_alpha/evaluation/rubrics/distributed-information-v1.json >/dev/null
          python3 -m json.tool software/product_alpha/evaluation/session-template.json >/dev/null
          python3 -m json.tool reports/product-alpha-0-1-multi-perspective-review.json >/dev/null
          python3 -m json.tool reports/product-alpha-0-2-route-selection.json >/dev/null
          python3 -m json.tool software/product_alpha/route-contracts/distributed-information.json >/dev/null
          python3 -m json.tool software/product_alpha/routes/refrigerator.json >/dev/null
          python3 -m json.tool software/product_alpha/routes/distributed-information.json >/dev/null
      - name: Validate product authorities
        run: |
          python3 software/product_alpha/evaluation/validate_internal_review.py check
          python3 software/product_alpha/evaluation/validate_route_selection.py check
      - name: Verify Product Alpha JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          for filename in ("index.html", "pilot-lab.html"):
              html = Path("software/product_alpha", filename).read_text(encoding="utf-8")
              scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
              if len(scripts) != 1:
                  raise SystemExit(f"{filename} must contain exactly one inline script")
              output = Path("/tmp") / f"principia-{filename.removesuffix('.html')}.js"
              output.write_text(scripts[0], encoding="utf-8")
          PY
          node --check software/product_alpha/model-adapters.js
          node --check /tmp/principia-index.js
          node --check /tmp/principia-pilot-lab.js
      - name: Run Product Alpha JavaScript tests
        run: node --test software/tests/test_product_alpha*.mjs
      - name: Verify deterministic builds
        run: |
          python3 software/product_alpha/build.py check --route refrigerator
          python3 software/product_alpha/build.py check --route distributed-information
      - name: Verify both loopback packages
        run: |
          python3 software/product_alpha/run_pilot.py check --route refrigerator
          python3 software/product_alpha/run_pilot.py check --route distributed-information
      - name: Run Product Alpha tests
        env:
          PYTHONWARNINGS: error::SyntaxWarning
        run: python3 -m unittest discover -s software/tests -p 'test_product_alpha*.py' -v
      - name: Verify clean repository
        run: git diff --exit-code
