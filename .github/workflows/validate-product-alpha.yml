name: Validate Product Alpha

on:
  pull_request:
    paths:
      - "PRODUCT_STATE.md"
      - "README.md"
      - "reports/product-alpha-0-1-*.md"
      - "reports/product-alpha-0-1-*.json"
      - "software/product_alpha/**"
      - "software/tests/test_product_alpha*.py"
      - "software/tests/test_product_alpha*.mjs"
      - "system-dossiers/refrigerator.md"
      - "failure-atlas/feedback-instability.md"
      - "investigations/room-cooling.md"
      - "design-challenges/passive-cooler.md"
      - ".github/workflows/validate-product-alpha.yml"
  push:
    paths:
      - "PRODUCT_STATE.md"
      - "README.md"
      - "reports/product-alpha-0-1-*.md"
      - "reports/product-alpha-0-1-*.json"
      - "software/product_alpha/**"
      - "software/tests/test_product_alpha*.py"
      - "software/tests/test_product_alpha*.mjs"
      - "system-dossiers/refrigerator.md"
      - "failure-atlas/feedback-instability.md"
      - "investigations/room-cooling.md"
      - "design-challenges/passive-cooler.md"
      - ".github/workflows/validate-product-alpha.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Product Alpha
        run: |
          python3 -m py_compile \
            software/product_alpha/build.py \
            software/product_alpha/run_pilot.py \
            software/product_alpha/prepare_pilot.py \
            software/product_alpha/launch_workspace.py \
            software/product_alpha/evaluation/summarize.py \
            software/product_alpha/evaluation/prepare_workspace.py \
            software/product_alpha/evaluation/assemble_workspace.py \
            software/product_alpha/evaluation/review_workspace.py \
            software/product_alpha/evaluation/record_decision.py \
            software/product_alpha/evaluation/workspace_status.py \
            software/product_alpha/evaluation/prepare_handoff.py \
            software/product_alpha/evaluation/verify_cohort.py \
            software/product_alpha/evaluation/prepare_review.py \
            software/product_alpha/evaluation/validate_internal_review.py
      - name: Verify evaluation JSON
        run: |
          python3 -m json.tool software/product_alpha/evaluation/rubric.json >/dev/null
          python3 -m json.tool software/product_alpha/evaluation/session-template.json >/dev/null
          python3 -m json.tool reports/product-alpha-0-1-multi-perspective-review.json >/dev/null
      - name: Validate internal product review
        run: python3 software/product_alpha/evaluation/validate_internal_review.py check
      - name: Verify Product Alpha JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          for filename in ("index.html", "pilot-lab.html"):
              html = Path("software/product_alpha", filename).read_text(encoding="utf-8")
              scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
              if len(scripts) != 1:
                  raise SystemExit(f"{filename} must contain exactly one inline script")
              output = Path("/tmp") / f"principia-{filename.removesuffix('.html')}.js"
              output.write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/principia-index.js
          node --check /tmp/principia-pilot-lab.js
      - name: Run Product Alpha JavaScript tests
        run: node --test software/tests/test_product_alpha*.mjs
      - name: Verify deterministic build
        run: python3 software/product_alpha/build.py check
      - name: Run Product Alpha tests
        env:
          PYTHONWARNINGS: error::SyntaxWarning
        run: python3 -m unittest discover -s software/tests -p 'test_product_alpha*.py' -v
      - name: Verify clean repository
        run: git diff --exit-code

  apply-internal-review-authority:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/product-alpha-internal-evaluation-authority'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: agent/product-alpha-internal-evaluation-authority
          fetch-depth: 0
      - name: Apply bounded authority update
        run: |
          if grep -q 'Current internal decision gate' README.md && \
             grep -q 'optional field observation' software/product_alpha/PILOT.md && \
             grep -q 'current_authority_is_internal_multi_perspective_review' software/tests/test_product_alpha_state_authority.py; then
            exit 0
          fi
          python3 software/product_alpha/_apply_internal_review_authority.py
          python3 software/product_alpha/_fix_internal_review_authority_tests.py
      - name: Validate bounded authority update
        run: |
          python3 software/product_alpha/evaluation/validate_internal_review.py check
          python3 -m unittest \
            software.tests.test_product_alpha_internal_review \
            software.tests.test_product_alpha_state_authority -v
          git diff --check
          if git diff --quiet; then
            exit 0
          fi
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "README.md reports/product-alpha-0-1-pilot-summary.md software/product_alpha/PILOT.md software/product_alpha/README.md software/tests/test_product_alpha_state_authority.py "
      - name: Commit authority update
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            README.md \
            reports/product-alpha-0-1-pilot-summary.md \
            software/product_alpha/PILOT.md \
            software/product_alpha/README.md \
            software/tests/test_product_alpha_state_authority.py
          git commit -m "Adopt internal multi-perspective product authority"
          git push origin HEAD:agent/product-alpha-internal-evaluation-authority
