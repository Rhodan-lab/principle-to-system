name: Validate Principia Atlas Compatibility

on:
  push:
    branches:
      - agent/phase-11a-principia-atlas-compatibility
      - agent/bridge-candidate-delayed-correction-r2
    paths:
      - 'contracts/principia-atlas/**'
      - 'integration/principia-atlas/**'
      - 'system-dossiers/**'
      - 'failure-atlas/**'
      - 'investigations/**'
      - 'design-challenges/**'
      - 'experiences/**'
      - 'templates/**'
      - 'release/phase-12-revision-impact.json'
      - 'release/phase-12-pilot-readiness.json'
      - 'release/phase-12-terminology.json'
      - 'release/README.md'
      - 'reports/principia-atlas-*'
      - 'scripts/export_principia_atlas_dependents.py'
      - 'scripts/finalize_bridge_candidate_records.py'
      - 'scripts/validate_principia_atlas_bridge.py'
      - 'scripts/validate_principia_atlas_audit.py'
      - 'scripts/validate_phase11b_expansion.py'
      - 'scripts/validate_phase12_release_candidate.py'
      - 'scripts/validate_phase13_software.py'
      - 'software/tests/test_bridge_candidate.py'
      - 'README.md'
      - 'PROJECT_STATE.md'
      - 'AUDIT.md'
      - '.github/workflows/validate-principia-atlas-compatibility.yml'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'software/product_alpha/**'
      - 'software/tests/test_product_alpha*.py'
      - 'software/tests/test_product_alpha*.mjs'
      - '.github/workflows/validate-product-alpha.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-principia-atlas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Principia bridge candidate
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile bridge and inherited validators
        run: |
          python3 -m py_compile scripts/export_principia_atlas_dependents.py
          python3 -m py_compile scripts/finalize_bridge_candidate_records.py
          python3 -m py_compile scripts/validate_principia_atlas_bridge.py
          python3 -m py_compile scripts/validate_principia_atlas_audit.py
          python3 -m py_compile scripts/validate_phase11b_expansion.py
          python3 -m py_compile scripts/validate_phase12_release_candidate.py
          python3 -m py_compile scripts/validate_phase13_software.py
          python3 -m py_compile software/tests/test_bridge_candidate.py

      - name: Run complete bridge candidate chain
        id: candidate_chain
        shell: bash
        run: |
          set +e
          status=0
          run_check() {
            printf '\n$'
            printf ' %q' "$@"
            printf '\n'
            "$@" || status=1
          }
          {
            run_check python3 scripts/finalize_bridge_candidate_records.py --check
            run_check python3 scripts/export_principia_atlas_dependents.py --check
            run_check python3 scripts/validate_principia_atlas_bridge.py
            run_check python3 scripts/validate_principia_atlas_audit.py
            run_check python3 scripts/validate_experiences.py --strict
            run_check python3 scripts/validate_phase11b_expansion.py
            run_check python3 scripts/validate_phase10_synthesis.py
            run_check python3 scripts/validate_phase10_audit.py
            run_check python3 scripts/validate_repo.py --strict
            run_check python3 scripts/validate_phase12_release_candidate.py
            run_check python3 -m unittest discover -s software/tests -v
            run_check python3 scripts/validate_phase13_software.py
          } > bridge-candidate-validation.log 2>&1
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat bridge-candidate-validation.log
          exit 0

      - name: Upload complete bridge candidate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bridge-candidate-validation-diagnostics
          path: bridge-candidate-validation.log

      - name: Stop on bridge candidate errors
        if: steps.candidate_chain.outputs.status != '0'
        run: exit 1

      - name: Verify workflow immutability
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/validate-principia-atlas-compatibility.yml').read_text(encoding='utf-8')
          forbidden = (
              'contents' + ': write',
              'git ' + 'push',
              'git ' + 'commit',
              'pull_request' + '_target',
              'repository: Rhodan-lab/' + 'Atlas',
          )
          assert 'contents: read' in workflow
          for token in forbidden:
              assert token not in workflow, token
          PY
