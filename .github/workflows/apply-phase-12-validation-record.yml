name: Apply Phase 12 Validation Record

on:
  push:
    branches:
      - agent/phase-12-release-candidate
    paths:
      - 'scripts/finalize_phase12_validation_record.py'
      - '.github/workflows/apply-phase-12-validation-record.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-phase-12-validation-record
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 12 branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-12-release-candidate
          fetch-depth: 0

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Finalize validation audit record
        run: |
          python3 scripts/finalize_phase12_validation_record.py --write
          python3 scripts/finalize_phase12_validation_record.py --check
          python3 -m py_compile scripts/finalize_phase12_validation_record.py
          python3 -m py_compile scripts/validate_phase12_release_candidate.py
          python3 scripts/validate_repo.py --strict
          python3 scripts/validate_phase12_release_candidate.py

      - name: Commit finalized audit record
        shell: bash
        run: |
          git restore .github/workflows/validate-phase-12-release-candidate.yml || true
          if git diff --quiet; then
            echo 'No validation-record changes remain.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_STATE.md README.md AUDIT.md reports/phase-12-release-candidate.md release/phase-12-pilot-readiness.json scripts/validate_phase12_release_candidate.py
          git commit -m 'release: finalize Phase 12 automated validation record'
          git pull --rebase origin agent/phase-12-release-candidate
          git push origin HEAD:agent/phase-12-release-candidate
